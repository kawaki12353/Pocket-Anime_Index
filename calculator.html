<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Importação da Fonte Isometra via Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>
<script src="database/typechart.js"></script>

<title>Pocket Anime - Type Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

/* HEADER */
.header {
  position: relative;
  text-align: center;
  margin-bottom: 30px;
}

/* LOGO */
.logo {
  width: 220px;
  max-width: 60vw;
}

/* CALCULATOR TITLE */
.calc-title {
  font-family: 'Isometra', sans-serif;
  position: relative;
  width: 80%;
  max-width: 800px;
  margin: 15px auto 12px;
  background: linear-gradient(to right, transparent, #1B2A44 25%, #1B2A44 75%, transparent);
  color: #ffffff;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  padding: 8px 40px;
  box-sizing: border-box;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
}

/* TABS / SELETORES DE MODO (DEFESA / OFENSIVA) */
.tabs-container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  max-width: 300px;
  margin: 0 auto 25px;
}

.tab-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: var(--text);
  opacity: 0.6;
  font-size: 16px;
  font-weight: bold;
  padding: 8px 16px;
  transition: color 0.3s ease, opacity 0.3s ease;
  flex: 1;
}

.tab-btn.active {
  color: #64b5f6;
  opacity: 1;
}

.tab-btn .tab-icon {
  width: 28px;
  height: 28px;
  object-fit: contain;
  transition: transform 0.2s ease;
}

.tab-btn svg path {
  fill: currentColor;
}

.tab-indicator {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  width: 50%;
  background-color: #64b5f6;
  border-radius: 3px;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* SELECTORS CONTAINER */
.selectors {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 30px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.selector-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.selector-label {
  font-size: 14px;
  color: var(--text);
  opacity: 0.8;
}

/* CUSTOM SELECT */
.custom-select {
  position: relative;
  width: 220px;
}

.select-btn {
  background: var(--card);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text);
  box-sizing: border-box;
  min-height: 46px;
}

.select-btn img {
  width: 26px;
  height: 26px;
}

.select-btn span {
  font-weight: bold;
}

.select-btn::after {
  content: "▼";
  margin-left: auto;
  font-size: 10px;
  color: var(--text);
  opacity: 0.7;
}

/* DROPDOWN */
.select-options {
  position: absolute;
  top: 110%;
  left: 0;
  width: 100%;
  background: var(--card);
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  max-height: 260px;
  overflow-y: auto;
  display: none;
  z-index: 10;
  border: 1px solid var(--border);
}

.select-options.open {
  display: block;
}

.option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: pointer;
}

.option img {
  width: 26px;
  height: 26px;
}

.option:hover {
  background: var(--hover);
}

/* MOBILE LAYOUT */
@media (max-width: 768px) {
  .header {
    display: block;
  }

  /* Logo no canto direito */
  .header-top {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }

  .logo {
    width: 150px;
  }

  /* Título centralizado */
  .calc-title {
    text-align: center;
    font-size: 18px;
    margin-top: 10px;
  }

  /* LADO A LADO PARA MOBILE NA ABA DEFESA */
  .selectors {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    box-sizing: border-box;
  }

  .selector-group {
    flex: 1;
    min-width: 0;
  }

  .custom-select {
    width: 100%;
  }

  .select-btn {
    padding: 8px 10px;
  }

  .select-btn span {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
}

/* SEÇÕES */
.section {
  background: var(--card);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
  color: var(--text);
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.section h2 {
  font-size: 18px;
  margin-bottom: 10px;
  text-align: center;
}

/* GRID */
.badges {
  display: grid;
  grid-template-columns: repeat(auto-fill, 105px);
  gap: 10px;
  justify-content: center;
}

/* BADGE */
.badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px;
  border-radius: 8px;
  color: #fff;
  font-weight: bold;
  font-size: 13px;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
}

.badge img {
  width: 36px;
  height: 36px;
}

/* CORES */
.x4   { background: #b71c1c; }
.x2   { background: #d32f2f; }
.x1   { background: #9e9e9e; }
.x05  { background: #388e3c; }
.x025 { background: #1b5e20; }
.x0   { background: #6a1b9a; }

/* LANG BUTTON */
.lang-toggle {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.lang-toggle button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-weight: bold;

  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

/* Modo claro */
:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;

  --lang-btn: #ffffff;
  --lang-btn-bg: #444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;

    --lang-btn: #111;
    --lang-btn-bg: #ffffff;
  }
}
</style>
</head>

<body>

<div class="header">

  <div class="header-top">
    <img src="assets/Pocket-Anime-logo.png" class="logo">
  </div>

  <h1 id="title" class="calc-title"></h1>
</div>

<!-- ABAS DEFESA / OFENSIVA -->
<div class="tabs-container">
  <button class="tab-btn active" id="tabDefense" onclick="switchMode('defense')">
    <svg class="tab-icon" viewBox="0 0 24 24">
      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
    </svg>
    <span id="labelDefense">Defesa</span>
  </button>
  <button class="tab-btn" id="tabOffense" onclick="switchMode('offense')">
    <img id="offenseIcon" class="tab-icon" src="assets/white_swords.png" alt="Ofensiva">
    <span id="labelOffense">Ofensiva</span>
  </button>
  <div class="tab-indicator" id="tabIndicator"></div>
</div>

<div class="selectors" id="selectorsContainer"></div>

<div id="results"></div>

<div class="lang-toggle">
  <button id="langBtn"></button>
</div>

<script>
const elements = [
  'Neutral','Fighting','Fire','Water','Nature','Earth','Wind','Ice',
  'Lightning','Soul','Psychic','Poison','Light','Dark','Demon','Beast'
];

const icons = {
  Neutral:'neutral_element.png', Fire:'fire_element.png', Water:'water_element.png',
  Nature:'nature_element.png', Earth:'earth_element.png', Wind:'wind_element.png',
  Ice:'ice_element.png', Lightning:'lightning_element.png', Soul:'soul_element.png',
  Psychic:'psychic_element.png', Demon:'demon_element.png', Poison:'poison_element.png',
  Fighting:'fighting_element.png', Light:'light_element.png', Dark:'dark_element.png',
  Beast:'beast_element.png'
};

const texts = {
  pt:{
    titleDefense:'Fraquezas e Resistências',
    titleOffense:'Cálculo de Dano Ofensivo',
    primary:'Tipo primário',
    secondary:'Tipo secundário',
    offenseType:'Tipo selecionado',
    selectPlaceholder:'Selecione',
    defenseTab:'Defesa',
    offenseTab:'Ofensiva',
    btn:'🇧🇷 PT',
    groupsDefense:{
      x4:'Fraqueza Extrema (x4)',
      x2:'Fraqueza (x2)',
      x1:'Dano Normal (x1)',
      x05:'Resistência (x0.5)',
      x025:'Super Resistência (x0.25)',
      x0:'Imune (x0)'
    },
    groupsOffense:{
      x4:'Dano Super Efetivo Extremo (x4)',
      x2:'Dano Super Efetivo (x2)',
      x1:'Dano Normal (x1)',
      x05:'Pouco Efetivo (x0.5)',
      x025:'Muito Pouco Efetivo (x0.25)',
      x0:'Sem Efeito (x0)'
    }
  },
  en:{
    titleDefense:'Weakness & Resistance',
    titleOffense:'Offensive Damage Calculator',
    primary:'Primary type',
    secondary:'Secondary type',
    offenseType:'Selected type',
    selectPlaceholder:'Select',
    defenseTab:'Defense',
    offenseTab:'Offense',
    btn:'🇺🇸 EN',
    groupsDefense:{
      x4:'Extreme Weakness (x4)',
      x2:'Weakness (x2)',
      x1:'Normal Damage (x1)',
      x05:'Resistance (x0.5)',
      x025:'Strong Resistance (x0.25)',
      x0:'Immune (x0)'
    },
    groupsOffense:{
      x4:'Extreme Super Effective (x4)',
      x2:'Super Effective (x2)',
      x1:'Normal Damage (x1)',
      x05:'Not Very Effective (x0.5)',
      x025:'Super Ineffective (x0.25)',
      x0:'No Effect (x0)'
    }
  }
};

let lang = localStorage.getItem("siteLang") || "pt";
let currentMode = 'defense';
let primaryValue='', secondaryValue='', offenseValue='';

function switchMode(mode) {
  currentMode = mode;
  const tabDefense = document.getElementById('tabDefense');
  const tabOffense = document.getElementById('tabOffense');
  const indicator = document.getElementById('tabIndicator');
  const offenseIcon = document.getElementById('offenseIcon');

  if (mode === 'defense') {
    tabDefense.classList.add('active');
    tabOffense.classList.remove('active');
    indicator.style.transform = 'translateX(0%)';
    offenseIcon.src = 'assets/white_swords.png';
  } else {
    tabDefense.classList.remove('active');
    tabOffense.classList.add('active');
    indicator.style.transform = 'translateX(100%)';
    offenseIcon.src = 'assets/blue_swords.png';
  }

  updateLang();
}

function createSelect(container, labelText, selectedValue, onSelect){
  container.innerHTML = `
    <div class="select-btn">
      ${
        selectedValue
          ? `<img src="assets/elements/${icons[selectedValue]}"><span>${selectedValue}</span>`
          : `<span>${texts[lang].selectPlaceholder}</span>`
      }
    </div>
    <div class="select-options"></div>
  `;
  const btn = container.querySelector('.select-btn');
  const options = container.querySelector('.select-options');

  btn.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.select-options').forEach(opt => {
      if (opt !== options) opt.classList.remove('open');
    });
    options.classList.toggle('open');
  };

  options.innerHTML = `<div class="option" data-value=""><span>${texts[lang].selectPlaceholder}</span></div>`;
  elements.forEach(e => {
    options.innerHTML += `
      <div class="option" data-value="${e}">
        <img src="assets/elements/${icons[e]}"><span>${e}</span>
      </div>`;
  });

  options.querySelectorAll('.option').forEach(opt => {
    opt.onclick = () => {
      const val = opt.dataset.value;
      btn.innerHTML = val
        ? `<img src="assets/elements/${icons[val]}"><span>${val}</span>`
        : `<span>${texts[lang].selectPlaceholder}</span>`;
      options.classList.remove('open');
      onSelect(val);
    };
  });
}

function renderSelectors() {
  const container = document.getElementById('selectorsContainer');
  container.innerHTML = '';

  if (currentMode === 'defense') {
    const group1 = document.createElement('div');
    group1.className = 'selector-group';
    group1.innerHTML = `<span class="selector-label">${texts[lang].primary}</span><div class="custom-select" id="primarySelect"></div>`;
    
    const group2 = document.createElement('div');
    group2.className = 'selector-group';
    group2.innerHTML = `<span class="selector-label">${texts[lang].secondary}</span><div class="custom-select" id="secondarySelect"></div>`;

    container.appendChild(group1);
    container.appendChild(group2);

    createSelect(document.getElementById('primarySelect'), texts[lang].primary, primaryValue, v => {
      primaryValue = v;
      calculate();
    });

    createSelect(document.getElementById('secondarySelect'), texts[lang].secondary, secondaryValue, v => {
      secondaryValue = v;
      calculate();
    });
  } else {
    const group = document.createElement('div');
    group.className = 'selector-group';
    group.innerHTML = `<span class="selector-label">${texts[lang].offenseType}</span><div class="custom-select" id="offenseSelect"></div>`;

    container.appendChild(group);

    createSelect(document.getElementById('offenseSelect'), texts[lang].offenseType, offenseValue, v => {
      offenseValue = v;
      calculate();
    });
  }
}

function calculate(){
  const damage = {};

  if (currentMode === 'defense') {
    elements.forEach(atk => {
      let m = 1;
      if (primaryValue && chart[atk]?.[primaryValue] != null) m *= chart[atk][primaryValue];
      if (secondaryValue && chart[atk]?.[secondaryValue] != null && primaryValue !== secondaryValue) m *= chart[atk][secondaryValue];
      damage[atk] = m;
    });
  } else {
    elements.forEach(def => {
      let m = 1;
      if (offenseValue && chart[offenseValue]?.[def] != null) {
        m = chart[offenseValue][def];
      }
      damage[def] = m;
    });
  }

  render(damage);
}

function render(damage){
  const results = document.getElementById('results');
  results.innerHTML = '';
  const map = { x4:[], x2:[], x1:[], x05:[], x025:[], x0:[] };

  for (const e in damage) {
    const v = damage[e];
    if (v === 0) map.x0.push(e);
    else if (v === 0.25) map.x025.push(e);
    else if (v === 0.5) map.x05.push(e);
    else if (v === 2) map.x2.push(e);
    else if (v === 4) map.x4.push(e);
    else map.x1.push(e);
  }

  const currentGroups = currentMode === 'defense' ? texts[lang].groupsDefense : texts[lang].groupsOffense;

  for (const k in map) {
    if (!map[k].length) continue;
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<h2>${currentGroups[k]}</h2>`;
    const box = document.createElement('div');
    box.className = 'badges';
    map[k].forEach(e => {
      box.innerHTML += `
        <div class="badge ${k}">
          <img src="assets/elements/${icons[e]}"><span>${e}</span>
        </div>`;
    });
    sec.appendChild(box);
    results.appendChild(sec);
  }
}

function updateLang(){
  document.getElementById('title').textContent = currentMode === 'defense' ? texts[lang].titleDefense : texts[lang].titleOffense;
  document.getElementById('langBtn').textContent = texts[lang].btn;
  document.getElementById('labelDefense').textContent = texts[lang].defenseTab;
  document.getElementById('labelOffense').textContent = texts[lang].offenseTab;

  renderSelectors();
  calculate();
}

document.getElementById('langBtn').onclick = () => {
  lang = lang === 'pt' ? 'en' : 'pt';
  localStorage.setItem("siteLang", lang);
  updateLang();

  if (typeof updateMenuLang === "function") {
    updateMenuLang();
  }
};

document.addEventListener("click", e => {
  document.querySelectorAll(".select-options").forEach(opt => {
    if (!opt.parentElement.contains(e.target)) {
      opt.classList.remove("open");
    }
  });
});

updateLang();
</script>

</body>
</html>
