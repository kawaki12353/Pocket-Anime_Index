<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Importação da Fonte Isometra via Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>
<script src="database/typechart.js"></script>

<title>Pocket Anime - Type Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

/* HEADER */
.header {
  position: relative;
  text-align: center;
  margin-bottom: 30px;
}

/* LOGO */
.logo {
  width: 220px;
  max-width: 60vw;
}

/* CALCULATOR TITLE */
.calc-title {
  font-family: 'Isometra', sans-serif;
  position: relative;
  width: 80%;
  max-width: 800px;
  margin: 15px auto 12px;
  background: linear-gradient(to right, transparent, #1B2A44 25%, #1B2A44 75%, transparent);
  color: #ffffff;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  padding: 8px 40px;
  box-sizing: border-box;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
}

/* MOBILE LAYOUT */
@media (max-width: 768px) {
  .header {
    display: block;
  }

  /* Logo no canto direito */
  .header-top {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }

  .logo {
    width: 150px;
  }

  /* Título centralizado */
  .calc-title {
    text-align: center;
    font-size: 18px;
    margin-top: 10px;
  }
}

/* ABAS DEFESA / OFENSIVA */
.tabs-container {
  position: relative;
  display: flex;
  justify-content: center;
  gap: 60px;
  max-width: 900px;
  margin: 0 auto 25px auto;
}

.tab-btn {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 5px 15px 10px;
  transition: color 0.3s ease;
  width: 100px;
}

.tab-btn svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.3s ease;
}

.tab-btn.active {
  color: #64b5f6;
}

.tab-btn.active svg {
  stroke: #64b5f6;
}

.tab-indicator {
  position: absolute;
  bottom: 0;
  height: 3px;
  background-color: #64b5f6;
  border-radius: 3px;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

/* SELECTORS */
.selectors {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 30px;
  /* Limita a largura para alinhar com os resultados */
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.select-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.select-label {
  font-size: 14px;
  color: var(--text);
  opacity: 0.8;
}

/* CUSTOM SELECT - Estilo arredondado igual o da imagem */
.custom-select {
  position: relative;
  width: 220px;
}

.select-btn {
  background: var(--card);
  border-radius: 20px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text);
}

.select-btn img {
  width: 26px;
  height: 26px;
}

.select-btn span {
  font-weight: bold;
}

.select-btn::after {
  content: "▼";
  margin-left: auto;
  font-size: 10px;
  color: var(--text);
  opacity: 0.7;
}

/* DROPDOWN */
.select-options {
  position: absolute;
  top: 110%;
  left: 0;
  width: 100%;
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  max-height: 260px;
  overflow-y: auto;
  display: none;
  z-index: 10;
  border: 1px solid var(--border);
}

.select-options.open {
  display: block;
}

.option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: pointer;
}

.option img {
  width: 26px;
  height: 26px;
}

.option:hover {
  background: var(--hover);
}

/* SEÇÕES */
.section {
  background: var(--card);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
  color: var(--text);
  /* Impede que o container de cada categoria estique na tela toda do PC */
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.section h2 {
  font-size: 18px;
  margin-bottom: 10px;
  text-align: center;
}

/* GRID */
.badges {
  display: grid;
  /* Define um tamanho fixo para os itens de tipo (105px) e centraliza */
  grid-template-columns: repeat(auto-fill, 105px);
  gap: 10px;
  justify-content: center;
}

/* BADGE */
.badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px;
  border-radius: 8px;
  color: #fff;
  font-weight: bold;
  font-size: 13px;
  text-align: center;
  width: 100%;
  box-sizing: border-box;
}

.badge img {
  width: 36px;
  height: 36px;
}

/* CORES */
.x4   { background: #b71c1c; }
.x2   { background: #d32f2f; }
.x1   { background: #9e9e9e; }
.x05  { background: #388e3c; }
.x025 { background: #1b5e20; }
.x0   { background: #6a1b9a; }

/* LANG BUTTON */
.lang-toggle {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.lang-toggle button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-weight: bold;

  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

/* Modo claro */
:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;

  --lang-btn: #ffffff;
  --lang-btn-bg: #444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;

    --lang-btn: #111;
    --lang-btn-bg: #ffffff;
  }
}
</style>
</head>

<body>

<div class="header">

  <div class="header-top">
    <img src="assets/Pocket-Anime-logo.png" class="logo">
  </div>

  <h1 id="title" class="calc-title"></h1>
</div>

<div class="tabs-container">
  <button class="tab-btn active" id="tabDefense" onclick="switchMode('defense')">
    <svg viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span id="labelDefense">Defesa</span>
  </button>
  <button class="tab-btn" id="tabOffense" onclick="switchMode('offense')">
    <svg viewBox="0 0 24 24">
      <!-- Espada apontada para a direita (subindo para direita) -->
      <path d="M6 18L18 6M18 6h-5M18 6v5M5 19l2-2" />
      <!-- Espada apontada para a esquerda (subindo para esquerda) -->
      <path d="M18 18L6 6M6 6h5M6 6v5M19 19l-2-2" />
    </svg>
    <span id="labelOffense">Ofensiva</span>
  </button>
  <div class="tab-indicator" id="tabIndicator"></div>
</div>

<div class="selectors" id="selectorsContainer">
  <!-- Renderizado dinamicamente via JS -->
</div>

<div id="results"></div>

<div class="lang-toggle">
  <button id="langBtn"></button>
</div>

<script>
const elements = [
  'Neutral','Fighting','Fire','Water','Nature','Earth','Wind','Ice',
  'Lightning','Soul','Psychic','Poison','Light','Dark','Demon','Beast'
];

const icons = {
  Neutral:'neutral_element.png', Fire:'fire_element.png', Water:'water_element.png',
  Nature:'nature_element.png', Earth:'earth_element.png', Wind:'wind_element.png',
  Ice:'ice_element.png', Lightning:'lightning_element.png', Soul:'soul_element.png',
  Psychic:'psychic_element.png', Demon:'demon_element.png', Poison:'poison_element.png',
  Fighting:'fighting_element.png', Light:'light_element.png', Dark:'dark_element.png',
  Beast:'beast_element.png'
};

const texts = {
  pt:{
    title:'Fraquezas e Resistências',primary:'Tipo primário',secondary:'Tipo secundário',single:'Selecione um Tipo',selectPlaceholder:'Selecione',btn:'🇧🇷 PT',
    tabDefense:'Defesa',tabOffense:'Ofensiva',
    groups:{x4:'Fraqueza Extrema (x4)',x2:'Fraqueza (x2)',x1:'Dano Normal (x1)',x05:'Resistência (x0.5)',x025:'Super Resistência (x0.25)',x0:'Imune (x0)'},
    offenseGroups:{x4:'Dano Super Efetivo (x4)',x2:'Super Efetivo (x2)',x1:'Dano Normal (x1)',x05:'Pouco Efetivo (x0.5)',x025:'Muito Pouco Efetivo (x0.25)',x0:'Sem Efeito (x0)'}
  },
  en:{
    title:'Weakness & Resistance',primary:'Primary type',secondary:'Secondary type',single:'Select a Type',selectPlaceholder:'Select',btn:'🇺🇸 EN',
    tabDefense:'Defense',tabOffense:'Offense',
    groups:{x4:'Extreme Weakness (x4)',x2:'Weakness (x2)',x1:'Normal Damage (x1)',x05:'Resistance (x0.5)',x025:'Strong Resistance (x0.25)',x0:'Immune (x0)'},
    offenseGroups:{x4:'Super Effective (x4)',x2:'Super Effective (x2)',x1:'Normal Damage (x1)',x05:'Not Very Effective (x0.5)',x025:'Very Weak (x0.25)',x0:'No Effect (x0)'}
  }
};

let lang = localStorage.getItem("siteLang") || "pt";
let currentMode = 'defense';
let primaryValue='', secondaryValue='', offenseValue='';

function updateTabIndicator() {
  const activeTab = currentMode === 'defense' ? document.getElementById('tabDefense') : document.getElementById('tabOffense');
  const indicator = document.getElementById('tabIndicator');
  if (activeTab && indicator) {
    indicator.style.width = `${activeTab.offsetWidth}px`;
    indicator.style.left = `${activeTab.offsetLeft}px`;
  }
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabDefense').classList.toggle('active', mode === 'defense');
  document.getElementById('tabOffense').classList.toggle('active', mode === 'offense');
  updateTabIndicator();
  renderSelectors();
  calculate();
}

function createSelect(containerId, label, selectedValue, onSelect){
  const container=document.getElementById(containerId);
  if (!container) return;
  const placeholder = texts[lang].selectPlaceholder;
  container.innerHTML=`
  <div class="select-btn">
    ${
      selectedValue
        ? `<img src="assets/elements/${icons[selectedValue]}"><span>${selectedValue}</span>`
        : `<span>${placeholder}</span>`
    }
  </div>
  <div class="select-options"></div>
`;
  const btn=container.querySelector('.select-btn');
  const options=container.querySelector('.select-options');
  btn.onclick=()=>options.classList.toggle('open');
  options.innerHTML=`<div class="option" data-value=""><span>${placeholder}</span></div>`;
  elements.forEach(e=>{
    options.innerHTML+=`
      <div class="option" data-value="${e}">
        <img src="assets/elements/${icons[e]}"><span>${e}</span>
      </div>`;
  });
  options.querySelectorAll('.option').forEach(opt=>{
    opt.onclick=()=>{
      const val=opt.dataset.value;

      btn.innerHTML = val
        ? `<img src="assets/elements/${icons[val]}"><span>${val}</span>`
        : `<span>${placeholder}</span>`;

      options.classList.remove('open');
      onSelect(val);
    };
  });
}

function renderSelectors() {
  const container = document.getElementById('selectorsContainer');
  if (currentMode === 'defense') {
    container.innerHTML = `
      <div class="select-wrapper">
        <span class="select-label">${texts[lang].primary}</span>
        <div class="custom-select" id="primarySelect"></div>
      </div>
      <div class="select-wrapper">
        <span class="select-label">${texts[lang].secondary}</span>
        <div class="custom-select" id="secondarySelect"></div>
      </div>
    `;
    createSelect('primarySelect', texts[lang].primary, primaryValue, v => {
      primaryValue = v;
      calculate();
    });
    createSelect('secondarySelect', texts[lang].secondary, secondaryValue, v => {
      secondaryValue = v;
      calculate();
    });
  } else {
    container.innerHTML = `
      <div class="select-wrapper">
        <span class="select-label">${texts[lang].single}</span>
        <div class="custom-select" id="offenseSelect"></div>
      </div>
    `;
    createSelect('offenseSelect', texts[lang].single, offenseValue, v => {
      offenseValue = v;
      calculate();
    });
  }
}

function calculate(){
  const damage={};
  if (currentMode === 'defense') {
    elements.forEach(atk=>{
      let m=1;
      if(primaryValue && chart[atk]?.[primaryValue]!=null) m*=chart[atk][primaryValue];
      if(secondaryValue && chart[atk]?.[secondaryValue]!=null && primaryValue!==secondaryValue) m*=chart[atk][secondaryValue];
      damage[atk]=m;
    });
  } else {
    elements.forEach(def => {
      let m = 1;
      if (offenseValue && chart[offenseValue]?.[def] != null) {
        m = chart[offenseValue][def];
      }
      damage[def] = m;
    });
  }
  render(damage);
}

function render(damage){
  results.innerHTML='';
  const map={x4:[],x2:[],x1:[],x05:[],x025:[],x0:[]};
  for(const e in damage){
    const v=damage[e];
    if(v===0) map.x0.push(e);
    else if(v===0.25) map.x025.push(e);
    else if(v===0.5) map.x05.push(e);
    else if(v===2) map.x2.push(e);
    else if(v===4) map.x4.push(e);
    else map.x1.push(e);
  }
  const groupTexts = currentMode === 'defense' ? texts[lang].groups : texts[lang].offenseGroups;
  for(const k in map){
    if(!map[k].length) continue;
    const sec=document.createElement('div');
    sec.className='section';
    sec.innerHTML=`<h2>${groupTexts[k]}</h2>`;
    const box=document.createElement('div');
    box.className='badges';
    map[k].forEach(e=>{
      box.innerHTML+=`
        <div class="badge ${k}">
          <img src="assets/elements/${icons[e]}"><span>${e}</span>
        </div>`;
    });
    sec.appendChild(box);
    results.appendChild(sec);
  }
}

function updateLang(){
  title.textContent=texts[lang].title;
  langBtn.textContent=texts[lang].btn;
  labelDefense.textContent=texts[lang].tabDefense;
  labelOffense.textContent=texts[lang].tabOffense;

  renderSelectors();
  calculate();
  setTimeout(updateTabIndicator, 50);
}

langBtn.onclick=()=>{
  lang = lang==='pt'?'en':'pt';
  localStorage.setItem("siteLang", lang);
  updateLang();

if (typeof updateMenuLang === "function") {
    updateMenuLang();
  }
};

document.addEventListener("click", e => {
  document.querySelectorAll(".select-options").forEach(opt => {
    if (!opt.parentElement.contains(e.target)) {
      opt.classList.remove("open");
    }
  });
});

window.addEventListener('resize', updateTabIndicator);

updateLang();
</script>

</body>
</html>
