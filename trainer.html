<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<title>Pocket Anime - Trainers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

/* COLORS */
:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;

  --green-box: #d8f5dc;
  --red-btn: #e74c3c;
  --yellow-box: #fff4c2;

  --lang-btn: #ffffff;
  --lang-btn-bg: #444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;

    --green-box: #1f3a2c;
    --red-btn: #c0392b;
    --yellow-box: #3a3520;

    --lang-btn: #111;
    --lang-btn-bg: #ffffff;
  }
}

/* HEADER */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 30px;
  gap: 12px;
}

.header-top {
  width: 100%;
  display: flex;
  justify-content: center;
}

.logo {
  width: 260px;
}

.title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* TRAINER LIST */
.trainer-list {
  max-width: 900px;
  margin: 0 auto;
}

.trainer-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
}

.trainer-header {
  padding: 14px;
  cursor: pointer;
  font-weight: bold;
}

.trainer-header:hover {
  background: var(--hover);
}

.trainer-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
  padding: 0 14px;
}

.trainer-item.active .trainer-content {
  max-height: 1000px;
  padding-bottom: 14px;
}

/* LAYOUT */
.trainer-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
}

.green-box {
  flex: 1;
  min-width: 200px;
  background: var(--green-box);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}

.green-box img {
  max-width: 100%;
  border-radius: 12px;
}

.red-btn {
  background: var(--red-btn);
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  min-width: 200px;
}

.yellow-container {
  flex: 2;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 250px;
}

.yellow-box {
  background: var(--yellow-box);
  padding: 12px;
  border-radius: 12px;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  max-width: 300px;
  text-align: center;
}

.modal.active {
  display: flex;
}

/* LANG BUTTON */
.lang-toggle {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.lang-toggle button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

/* MOBILE */
@media (max-width: 768px) {
  .header-top {
    justify-content: flex-end;
  }

  .logo {
    width: 150px;
  }

  .trainer-layout {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="header">
 <div class="header-top">
  <img src="assets/Pocket-Anime-logo.png" class="logo">
 </div>

 <h2 class="title" id="pageTitle"></h2>
</div>

<div class="trainer-list">
  <div class="trainer-item">
    <div class="trainer-header">Sunburst Forest</div>
    <div class="trainer-content">
      <div class="trainer-layout">

        <!-- GREEN -->
        <div class="green-box">
          <img src="assets/trainers/marine_captain.png" alt="Marine Captain">
          <p><strong>Marine Captain</strong></p>
        </div>

        <!-- RED -->
        <button class="red-btn" id="animonBtn"></button>

        <!-- YELLOW -->
        <div class="yellow-container">
          <div class="yellow-box" id="descText"></div>
          <div class="yellow-box" id="dropText"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="animonTitle"></h3>
    <p>• AquaLion<br>• TideSerpent<br>• CoralKnight</p>
    <br>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<div class="lang-toggle">
  <button id="langBtn"></button>
</div>

<script>
const trainerHeader = document.querySelector(".trainer-header");
const trainerItem = document.querySelector(".trainer-item");
const modal = document.getElementById("modal");
const animonBtn = document.getElementById("animonBtn");
const langBtn = document.getElementById("langBtn");

trainerHeader.onclick = () => {
  trainerItem.classList.toggle("active");
};

animonBtn.onclick = () => {
  modal.classList.add("active");
};

function closeModal(){
  modal.classList.remove("active");
}

/* LANGUAGE */
const texts = {
  pt: {
    btn: "🇧🇷 PT",
    title: "Treinadores Retornáveis",
    animons: "Ver Animons",
    desc: "Um capitão veterano que domina Animons do tipo água.",
    drop: "Drops: Gold Coin, Water Shard, Captain Badge",
    animonTitle: "Animons do Marine Captain"
  },
  en: {
    btn: "🇺🇸 EN",
    title: "Returnable Trainers",
    animons: "View Animons",
    desc: "A veteran captain who commands water-type Animons.",
    drop: "Drops: Gold Coin, Water Shard, Captain Badge",
    animonTitle: "Marine Captain's Animons"
  }
};

let lang = localStorage.getItem("siteLang") || "pt";

function updateLang(){
  langBtn.textContent = texts[lang].btn;
  document.getElementById("pageTitle").textContent = texts[lang].title;
  animonBtn.textContent = texts[lang].animons;
  document.getElementById("descText").textContent = texts[lang].desc;
  document.getElementById("dropText").textContent = texts[lang].drop;
  document.getElementById("animonTitle").textContent = texts[lang].animonTitle;
}

langBtn.onclick = () => {
  lang = lang === "pt" ? "en" : "pt";
  localStorage.setItem("siteLang", lang);
  updateLang();
};

updateLang();
</script>

</body>
</html>
