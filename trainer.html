<!DOCTYPE html>      
<html lang="pt-BR">      
<head>      
<meta charset="UTF-8">      
<meta name="viewport" content="width=device-width, initial-scale=1.0">      

<link rel="stylesheet" href="menu.css">      
<script src="menu.js" defer></script>      

<title>Pocket Anime - Trainers</title>      

<style>      
body {      
  font-family: Arial, sans-serif;      
  background: var(--bg);      
  color: var(--text);      
  padding: 20px;      
  margin: 0;      
}      

:root{      
  --bg: #f2f4f7;      
  --card: #ffffff;      
  --text: #111;      
  --border: #ccc;      
  --hover: #f1f1f1;      
  --lang-btn: #ffffff;      
  --lang-btn-bg: #444;      
}      

@media (prefers-color-scheme: dark){      
  :root{      
    --bg: #0f1217;      
    --card: #181c24;      
    --text: #ffffff;      
    --border: #2a2f3a;      
    --hover: #232836;      
    --lang-btn: #111;      
    --lang-btn-bg: #ffffff;      
  }      
}      

.header {      
  display: flex;      
  flex-direction: column;      
  align-items: center;      
  max-width: 1200px;      
  margin: 0 auto 30px;      
  gap: 12px;      
}      

.header-top {      
  width: 100%;      
  display: flex;      
  justify-content: center;      
}      

.logo {      
  width: 260px;      
}      

.trainer-title {      
  text-align: center;      
  font-size: 20px;      
  font-weight: bold;      
  margin: 0;      
}      

.search-container {      
  width: 100%;      
  max-width: 500px;      
}      

.search-container input {      
  width: 100%;      
  padding: 8px 10px;      
  border-radius: 10px;      
  border: 1px solid var(--border);      
  font-size: 14px;      
  background: var(--card);      
  color: var(--text);      
}      

.trainer-list { max-width: 900px; margin: 0 auto; }      

.trainer-item {      
  background: var(--card);      
  border: 1px solid var(--border);      
  border-radius: 14px;      
  margin-bottom: 12px;      
  overflow: hidden;      
}      

.trainer-header {      
  padding: 14px;      
  cursor: pointer;      
  font-weight: bold;      
}      

.trainer-header:hover { background: var(--hover); }      

.trainer-content {      
  max-height: 0;      
  display: flex;      
  justify-content: center;      
  overflow: hidden;      
  transition: max-height 0.35s ease;      
}      

.trainer-item.active .trainer-content {      
  max-height: 1000px;      
}      

.trainer-layout {      
  display: flex;      
  gap: 15px;      
  flex-wrap: wrap;      
  padding: 15px;      
}      

.trainer-photo {      
  flex: 1;      
  min-width: 180px;      
  border: 2px solid var(--border);      
  border-radius: 12px;      
  padding: 10px;      
  text-align: center;      
}      

.trainer-photo img {      
  width: 100%;      
  border-radius: 10px;      
}      

.animon-btn {      
  margin-top: 0;      
  padding: 8px;      
  border-radius: 10px;      
  border: none;      
  cursor: pointer;      
  font-weight: bold;      
  background: var(--lang-btn-bg);      
  color: var(--lang-btn);      
}      

.trainer-info {      
  flex: 2;      
  min-width: 250px;      
  border: 2px solid var(--border);      
  border-radius: 12px;      
  padding: 15px;      
}      

.modal {      
  position: fixed;      
  inset: 0;      
  background: rgba(0,0,0,0.6);      
  display: flex;      
  justify-content: center;      
  align-items: center;      
  opacity: 0;      
  pointer-events: none;      
  transition: 0.3s;      
}      

.modal.active {      
  opacity: 1;      
  pointer-events: auto;      
}      

.modal-content {      
  background: var(--card);      
  padding: 20px;      
  border-radius: 14px;      
  width: 300px;      
  text-align: center;      
}      

.lang-toggle {      
  position: fixed;      
  bottom: 10px;      
  left: 50%;      
  transform: translateX(-50%);      
}      

.lang-toggle button {      
  padding: 8px 14px;      
  border-radius: 20px;      
  border: none;      
  font-weight: bold;      
  cursor: pointer;      
  background: var(--lang-btn-bg);      
  color: var(--lang-btn);      
}  

.button-row{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

.mode-btn{
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-weight: bold;
  background: var(--bg);
  color: var(--text);
  cursor: default;
}    

.reward-list{
  margin: 5px 0 0 0;
  padding-left: 18px;
}

.reward-list li{
  margin-bottom: 4px;
}

.animon-item{
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

.animon-item:last-child{
  border-bottom: none;
}

.animon-item{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

.animon-elements{
  display: flex;
  gap: 6px;
}

.animon-elements img{
  width: 24px;
  height: 24px;
  object-fit: contain;
}

/* PC */
@media (min-width: 1024px) {
  .modal-content {
    width: 800px;
    max-width: 90%;
    padding: 40px;
    font-size: 18px;
  }

  .animon-item {
    padding: 14px 0;
    font-size: 18px;
  }

  .animon-elements img {
    width: 30px;
    height: 30px;
  }
}

@media (max-width: 768px) {      
  .header-top {      
    justify-content: flex-end;      
  }      

  .logo {      
    width: 150px;      
  }      

  .search-container {      
    max-width: 300px;      
  }      

  .trainer-photo img {      
    width: 75%;      
  }      
}      
</style>      
</head>      

<body>      

<div class="header">      
 <div class="header-top">      
  <img src="assets/Pocket-Anime-logo.png" class="logo">      
 </div>      

<h2 class="trainer-title" id="trainerTitle"></h2>      

<div class="search-container">      
  <input type="text" id="searchInput">      
</div>      
</div>    

<div class="trainer-list" id="trainerList"></div>      

<div class="lang-toggle">      
  <button id="langBtn"></button>      
</div>      

<div class="modal" id="animonModal">      
  <div class="modal-content">      
    <h3 id="modalTitle"></h3>      
    <p id="modalAnimons"></p>      
  </div>      
</div>      

<script src="trainer-data.js"></script>

<script>      

const trainerList = document.getElementById("trainerList");
const searchInput = document.getElementById("searchInput");
const langBtn = document.getElementById("langBtn");

let lang = localStorage.getItem("siteLang") || "pt";

function render(filter=""){
  const activeTrainer = document.querySelector(".trainer-item.active .trainer-header")?.textContent;

  trainerList.innerHTML = "";

  trainers
  .filter(t => t.trainer.toLowerCase().includes(filter))
  .sort((a, b) => a.trainer.localeCompare(b.trainer))
  .forEach((t) => {

    const item = document.createElement("div");
    item.className = "trainer-item";

    item.innerHTML = `
      <div class="trainer-header">${t.trainer}</div>
      <div class="trainer-content">
        <div class="trainer-layout">
          <div class="trainer-photo">
            <img src="${t.photo}">
            <div class="button-row">
              <button class="mode-btn">${t.mode}</button>
              <button class="animon-btn">
                ${lang === "pt" ? "Ver Animons" : "View Animons"}
              </button>
            </div>
          </div>
          <div class="trainer-info">
            <h4>${lang === "pt" ? "Descrição" : "Description"}</h4>
            <p>${lang === "pt" ? t.description_pt : t.description_en}</p>
            <h4>${lang === "pt" ? "Recompensas" : "Rewards"}</h4>
            <ul class="reward-list">
             ${(lang === "pt" ? t.drops_pt : t.drops_en)
              .split(",")
              .map(r => `<li>${r.trim()}</li>`)
              .join("")}
           </ul>
          </div>
        </div>
      </div>
    `;

    if (t.trainer === activeTrainer) {
      item.classList.add("active");
    }

    item.querySelector(".trainer-header").onclick = () => {
      const isActive = item.classList.contains("active");
      document.querySelectorAll(".trainer-item").forEach(el => el.classList.remove("active"));
      if (!isActive) item.classList.add("active");
    };

    item.querySelector(".animon-btn").onclick = (e) => {
      e.stopPropagation();
      document.getElementById("animonModal").classList.add("active");
      document.getElementById("modalTitle").textContent =
        lang === "pt" ? "Animons do Treinador" : "Trainer Animons";

      const sortedAnimons = t.animons;

document.getElementById("modalAnimons").innerHTML =
  sortedAnimons
    .map((animon, index) => {

      const elements = animonElements[animon] || [];

      const elementIcons = elements.map(el => 
        `<img src="assets/${el}_element.png" alt="${el}">`
      ).join("");

      return `
        <div class="animon-item">
          <span>${index + 1}. ${animon}</span>
          <div class="animon-elements">
            ${elementIcons}
          </div>
        </div>
      `;
    })
    .join("");
    };

    trainerList.appendChild(item);
  });
}

searchInput.addEventListener("input", () => {
  render(searchInput.value.toLowerCase());
});

const texts = {
  pt:{ btn:"🇧🇷 PT", search:"Pesquisar treinador...", title:'Treinadores Retornáveis' },
  en:{ btn:"🇺🇸 EN", search:"Search trainer...", title:'Returnable Trainers' }
};

function updateLang(){
  langBtn.textContent = texts[lang].btn;
  searchInput.placeholder = texts[lang].search;
  document.getElementById("trainerTitle").textContent = texts[lang].title;
  render(searchInput.value.toLowerCase());
}

langBtn.onclick = () => {
  lang = lang === "pt" ? "en" : "pt";
  localStorage.setItem("siteLang", lang);
  updateLang();
  if(typeof updateMenuLang==="function"){ updateMenuLang(); }
};

document.getElementById("animonModal").onclick = () => {
  document.getElementById("animonModal").classList.remove("active");
};

updateLang();
</script>

</body>
</html>
