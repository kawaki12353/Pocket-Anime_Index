<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Anime - Treinadores</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

/* COLORS */
:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;
  }
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 30px;
}

.logo {
  width: 220px;
}

/* TRAINER CARD */
.trainer-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  gap: 20px;
  align-items: center;
  margin-bottom: 16px;
}

/* LEFT - IMAGE */
.trainer-image {
  width: 160px;
  height: 160px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid var(--border);
  flex-shrink: 0;
}

.trainer-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* RIGHT CONTENT */
.trainer-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.trainer-description,
.trainer-drops {
  background: var(--hover);
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

/* BUTTON */
.animon-btn {
  padding: 10px 16px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: var(--text);
  color: var(--card);
  width: fit-content;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  visibility: hidden;
  opacity: 0;
  transition: 0.3s;
}

.modal.active {
  visibility: visible;
  opacity: 1;
}

.modal-content {
  background: var(--card);
  padding: 20px;
  border-radius: 14px;
  max-width: 400px;
  width: 90%;
  text-align: center;
}

.close-btn {
  margin-top: 14px;
  padding: 8px 14px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: var(--text);
  color: var(--card);
}

@media (max-width: 768px){
  .trainer-card {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .trainer-image {
    width: 130px;
    height: 130px;
  }

  .animon-btn {
    margin: 0 auto;
  }
}

</style>
</head>

<body>

<div class="header">
  <img src="assets/Pocket-Anime-logo.png" class="logo">
  <h2>Treinadores Retornáveis</h2>
</div>

<div id="trainerList"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <div id="modalAnimons"></div>
    <button class="close-btn" onclick="closeModal()">Fechar</button>
  </div>
</div>

<script>

/* TRAINER CONFIG */
const trainers = [
  {
    name: "Leon",
    image: "assets/trainers/leon.png",
    description: "Um treinador forte especializado em Animons de fogo.",
    drops: ["Fire Stone", "Gold Coin", "XP Scroll"],
    animons: ["Blazion", "Inferbat", "Volcanix"]
  },
  {
    name: "Aqua Mira",
    image: "assets/trainers/aqua.png",
    description: "Especialista em Animons aquáticos com grande defesa.",
    drops: ["Water Crystal", "Potion+", "Pearl"],
    animons: ["Aquary", "Tsunamix", "Bubbleon"]
  }
];

const trainerList = document.getElementById("trainerList");

function renderTrainers(){
  trainerList.innerHTML = "";

  trainers.forEach(trainer => {
    const card = document.createElement("div");
    card.className = "trainer-card";

    card.innerHTML = `
      <div class="trainer-image">
        <img src="${trainer.image}" alt="${trainer.name}">
      </div>

      <div class="trainer-info">
        <div class="trainer-description">
          <strong>Descrição:</strong><br>
          ${trainer.description}
        </div>

        <div class="trainer-drops">
          <strong>Itens Dropáveis:</strong><br>
          ${trainer.drops.join(", ")}
        </div>

        <button class="animon-btn" onclick='openModal(${JSON.stringify(trainer)})'>
          Ver Animons
        </button>
      </div>
    `;

    trainerList.appendChild(card);
  });
}

function openModal(trainer){
  document.getElementById("modalTitle").textContent = trainer.name;
  document.getElementById("modalAnimons").innerHTML =
    "<strong>Animons:</strong><br>" + trainer.animons.join("<br>");

  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}

renderTrainers();

</script>

</body>
</html>
