<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<title>Pocket Anime - Trainers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

/* COLORS */
:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;

  --lang-btn: #ffffff;
  --lang-btn-bg: #444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;

    --lang-btn: #111;
    --lang-btn-bg: #ffffff;
  }
}

/* HEADER */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 30px;
  gap: 12px;
}

.header-top {
  width: 100%;
  display: flex;
  justify-content: center;
}

.logo {
  width: 260px;
}

.map-title {
  text-align: center;
  margin-bottom: 12px;
  font-size: 20px;
  font-weight: bold;
}

.search-container {
  width: 100%;
  max-width: 500px;
}

.search-container input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
  background: var(--card);
  color: var(--text);
}

/* LIST */
.map-list {
  max-width: 900px;
  margin: 0 auto;
}

.map-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
}

.map-header {
  padding: 14px;
  cursor: pointer;
  font-weight: bold;
}

.map-header:hover {
  background: var(--hover);
}

/* TRAINER CONTENT */
.map-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}

.map-item.active .map-content {
  max-height: 1000px;
  padding: 15px;
}

.trainer-layout {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

/* VERDE - FOTO */
.trainer-photo {
  flex: 1;
  min-width: 180px;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}

.trainer-photo img {
  width: 100%;
  border-radius: 10px;
}

/* VERMELHO - BOTÃO ANIMONS */
.animon-btn {
  margin-top: 10px;
  padding: 8px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

/* AMARELO - TEXTO */
.trainer-info {
  flex: 2;
  min-width: 250px;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 15px;
}

.trainer-info h4 {
  margin: 0 0 8px 0;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}

.modal.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: var(--card);
  padding: 20px;
  border-radius: 14px;
  width: 300px;
  text-align: center;
}

/* LANG BUTTON */
.lang-toggle {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.lang-toggle button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

/* MOBILE */
@media (max-width: 768px) {
  .logo { width: 150px; }
  .map-list { max-width: 420px; }
}
</style>
</head>

<body>

<div class="header">
 <div class="header-top">
  <img src="assets/Pocket-Anime-logo.png" class="logo">
 </div>

<h2 class="map-title" id="mapTitle"></h2>

<div class="search-container">
  <input type="text" id="searchInput">
</div>

<div class="map-list" id="mapList"></div>

<div class="lang-toggle">
  <button id="langBtn"></button>
</div>

<!-- MODAL -->
<div class="modal" id="animonModal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <p id="modalAnimons"></p>
  </div>
</div>

<script>
const trainers = [
{
  name: "Sunburst Forest",
  trainer: "Marine Captain",
  photo: "assets/trainers/marine_captain.png",
  description_pt: "Um capitão experiente que domina batalhas estratégicas no mar e na floresta.",
  description_en: "An experienced captain who dominates strategic battles at sea and forest.",
  drops_pt: "Drops: Pearl Shard, Captain Badge, Rare Potion",
  drops_en: "Drops: Pearl Shard, Captain Badge, Rare Potion",
  animons: ["Aquazor", "Shellion", "Maritide"]
}
];

const mapList = document.getElementById("mapList");
const searchInput = document.getElementById("searchInput");
const langBtn = document.getElementById("langBtn");

let lang = localStorage.getItem("siteLang") || "pt";

function render(filter=""){
  mapList.innerHTML = "";

  trainers
  .filter(t => t.name.toLowerCase().includes(filter))
  .forEach(t => {

    const item = document.createElement("div");
    item.className = "map-item";

    item.innerHTML = `
      <div class="map-header">${t.name}</div>
      <div class="map-content">
        <div class="trainer-layout">

          <div class="trainer-photo">
            <h4>${t.trainer}</h4>
            <img src="${t.photo}">
            <button class="animon-btn">${lang === "pt" ? "Ver Animons" : "View Animons"}</button>
          </div>

          <div class="trainer-info">
            <h4>${lang === "pt" ? "Descrição" : "Description"}</h4>
            <p>${lang === "pt" ? t.description_pt : t.description_en}</p>
            <h4>${lang === "pt" ? "Itens Dropados" : "Dropped Items"}</h4>
            <p>${lang === "pt" ? t.drops_pt : t.drops_en}</p>
          </div>

        </div>
      </div>
    `;

    item.querySelector(".map-header").onclick = () => {
      const isActive = item.classList.contains("active");
      document.querySelectorAll(".map-item").forEach(i=>i.classList.remove("active"));
      if(!isActive) item.classList.add("active");
    };

    item.querySelector(".animon-btn").onclick = (e) => {
      e.stopPropagation();
      document.getElementById("animonModal").classList.add("active");
      document.getElementById("modalTitle").textContent =
        lang === "pt" ? "Animons do Treinador" : "Trainer Animons";
      document.getElementById("modalAnimons").textContent =
        t.animons.join(", ");
    };

    mapList.appendChild(item);
  });
}

searchInput.addEventListener("input", () => {
  render(searchInput.value.toLowerCase());
});

const texts = {
  pt:{ btn:"🇧🇷 PT", search:"Pesquisar treinador...", title:'Treinadores Retornáveis' },
  en:{ btn:"🇺🇸 EN", search:"Search trainer...", title:'Returnable Trainers' }
};

function updateLang(){
  langBtn.textContent = texts[lang].btn;
  searchInput.placeholder = texts[lang].search;
  document.getElementById("mapTitle").textContent = texts[lang].title;
  render();
}

langBtn.onclick = () => {
  lang = lang === "pt" ? "en" : "pt";
  localStorage.setItem("siteLang", lang);
  updateLang();
  if(typeof updateMenuLang==="function"){ updateMenuLang(); }
};

document.getElementById("animonModal").onclick = () => {
  document.getElementById("animonModal").classList.remove("active");
};

updateLang();
</script>

</body>
</html>
