<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<title>Pocket Anime - Trainers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

/* COLORS */
:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;
  --lang-btn: #ffffff;
  --lang-btn-bg: #444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;
    --lang-btn: #111;
    --lang-btn-bg: #ffffff;
  }
}

/* HEADER */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 30px;
  gap: 12px;
}

.logo { width: 260px; }

.trainer-title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.search-container {
  width: 100%;
  max-width: 500px;
}

.search-container input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
}

.trainer-list {
  max-width: 900px;
  margin: 0 auto;
}

.trainer-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
}

.trainer-header {
  padding: 14px;
  cursor: pointer;
  font-weight: bold;
}

.trainer-header:hover {
  background: var(--hover);
}

.trainer-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
  padding: 0 14px;
}

.trainer-item.active .trainer-content {
  max-height: 1000px;
  padding-bottom: 14px;
}

/* LAYOUT INTERNO */
.trainer-layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 14px;
  margin-top: 12px;
}

/* VERDE - FOTO */
.trainer-photo {
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}

.trainer-photo img {
  width: 100%;
  border-radius: 10px;
}

/* VERMELHO - BOTÃO */
.animons-btn {
  margin-top: 10px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: var(--hover);
  color: var(--text);
}

/* AMARELO - TEXTO */
.trainer-text {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.text-box {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  background: var(--bg);
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: var(--card);
  padding: 20px;
  border-radius: 14px;
  max-width: 400px;
  width: 90%;
}

.modal h3 {
  margin-top: 0;
}

/* LANG BUTTON */
.lang-toggle {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.lang-toggle button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

/* MOBILE */
@media (max-width:768px){
  .logo { width:150px; }
  .trainer-layout {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <img src="assets/Pocket-Anime-logo.png" class="logo">
  <h2 class="trainer-title" id="trainerTitle"></h2>

  <div class="search-container">
    <input type="text" id="searchInput">
  </div>
</div>

<div class="trainer-list" id="trainerList"></div>

<div class="modal" id="animonModal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <ul id="animonList"></ul>
  </div>
</div>

<div class="lang-toggle">
  <button id="langBtn"></button>
</div>

<script>
const trainers = [
{
  name: "Marine Captain",
  photo: "assets/trainers/marine_captain.png",
  description: {
    pt: "Um capitão veterano dos mares, especialista em batalhas navais e estratégias táticas.",
    en: "A veteran sea captain, specialist in naval battles and tactical strategies."
  },
  drops: {
    pt: "Drops: Marine Badge, Rare Compass, 500 Gold",
    en: "Drops: Marine Badge, Rare Compass, 500 Gold"
  },
  animons: ["SeaDrake", "WaveShark", "StormEel"]
}
];

const trainerList = document.getElementById("trainerList");
const searchInput = document.getElementById("searchInput");
const langBtn = document.getElementById("langBtn");
const modal = document.getElementById("animonModal");

function renderTrainers(filter=""){
  trainerList.innerHTML="";
  trainers
  .filter(t=>t.name.toLowerCase().includes(filter))
  .forEach(trainer=>{
    const item=document.createElement("div");
    item.className="trainer-item";

    item.innerHTML=`
      <div class="trainer-header">${trainer.name}</div>
      <div class="trainer-content">
        <div class="trainer-layout">

          <div class="trainer-photo">
            <img src="${trainer.photo}" alt="${trainer.name}">
            <button class="animons-btn">${lang==="pt"?"Ver Animons":"View Animons"}</button>
          </div>

          <div class="trainer-text">
            <div class="text-box">${trainer.description[lang]}</div>
            <div class="text-box">${trainer.drops[lang]}</div>
          </div>

        </div>
      </div>
    `;

    item.querySelector(".trainer-header").onclick=()=>{
      const active=item.classList.contains("active");
      document.querySelectorAll(".trainer-item")
      .forEach(i=>i.classList.remove("active"));
      if(!active)item.classList.add("active");
    };

    item.querySelector(".animons-btn").onclick=()=>{
      document.getElementById("modalTitle").textContent=trainer.name+" - Animons";
      document.getElementById("animonList").innerHTML=
        trainer.animons.map(a=>`<li>${a}</li>`).join("");
      modal.style.display="flex";
    };

    trainerList.appendChild(item);
  });
}

modal.onclick=()=>modal.style.display="none";

searchInput.addEventListener("input",()=>{
  renderTrainers(searchInput.value.toLowerCase());
});

const texts={
  pt:{btn:"🇧🇷 PT",search:"Pesquisar treinador...",title:"Treinadores Retornáveis"},
  en:{btn:"🇺🇸 EN",search:"Search trainer...",title:"Returnable Trainers"}
};

let lang=localStorage.getItem("siteLang")||"pt";

function updateLang(){
  langBtn.textContent=texts[lang].btn;
  searchInput.placeholder=texts[lang].search;
  document.getElementById("trainerTitle").textContent=texts[lang].title;
  renderTrainers(searchInput.value.toLowerCase());
}

langBtn.onclick=()=>{
  lang=lang==="pt"?"en":"pt";
  localStorage.setItem("siteLang",lang);
  updateLang();
  if(typeof updateMenuLang==="function"){updateMenuLang();}
};

updateLang();
</script>

</body>
</html>
