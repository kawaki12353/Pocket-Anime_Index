<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<title>Pocket Anime - Trainers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

/* COLORS */
:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;

  --lang-btn: #ffffff;
  --lang-btn-bg: #444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;

    --lang-btn: #111;
    --lang-btn-bg: #ffffff;
  }
}

/* HEADER */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 30px;
  gap: 12px;
}

.header-top {
  width: 100%;
  display: flex;
  justify-content: center;
}

.logo {
  width: 260px;
}

.map-title {
  text-align: center;
  margin-bottom: 12px;
  font-size: 20px;
  font-weight: bold;
}

.search-container {
  width: 100%;
  max-width: 500px;
}

.search-container input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
  background: var(--card);
  color: var(--text);
}

/* TRAINER CARD */
.trainer-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 20px;
  padding: 16px;
}

.trainer-layout {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

/* GREEN - IMAGE FRAME */
.trainer-image {
  flex: 1;
  min-width: 180px;
}

.trainer-image img {
  width: 100%;
  border-radius: 12px;
  border: 2px solid var(--border);
}

/* RED - BUTTON */
.animon-btn {
  margin-top: 10px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: var(--hover);
  color: var(--text);
}

/* YELLOW - TEXT CONTAINER */
.trainer-info {
  flex: 2;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.description, .drops {
  padding: 12px;
  border-radius: 10px;
  background: var(--hover);
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  visibility: hidden;
  opacity: 0;
  transition: 0.3s;
}

.modal.active {
  visibility: visible;
  opacity: 1;
}

.modal-content {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  width: 300px;
  max-width: 90%;
}

.close-btn {
  margin-top: 12px;
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* LANG BUTTON */
.lang-toggle {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.lang-toggle button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

</style>
</head>

<body>

<div class="header">
 <div class="header-top">
  <img src="assets/Pocket-Anime-logo.png" class="logo">
</div>

<h2 class="map-title" id="pageTitle"></h2>

<div class="search-container">
  <input type="text" id="searchInput">
</div>

<div id="trainerList"></div>

<div class="lang-toggle">
  <button id="langBtn"></button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div id="modalAnimons"></div>
    <button class="close-btn" onclick="closeModal()">OK</button>
  </div>
</div>

<script>

/* TRAINERS DATA */
const trainers = [
  {
    name: "Aiden",
    image: "assets/trainers/aiden.png",
    description: {
      pt: "Treinador veterano especialista em fogo.",
      en: "Veteran trainer specialized in fire."
    },
    drops: {
      pt: "Dropa: Fire Stone, Gold Coin",
      en: "Drops: Fire Stone, Gold Coin"
    },
    animons: ["Flareon", "Magmar", "Blaziken"]
  }
];

const trainerList = document.getElementById("trainerList");
const searchInput = document.getElementById("searchInput");
const langBtn = document.getElementById("langBtn");
const modal = document.getElementById("modal");
const modalAnimons = document.getElementById("modalAnimons");

/* RENDER */
function renderTrainers(filter = "") {
  trainerList.innerHTML = "";

  trainers
    .filter(t => t.name.toLowerCase().includes(filter))
    .forEach(trainer => {

      const card = document.createElement("div");
      card.className = "trainer-card";

      card.innerHTML = `
        <div class="trainer-layout">
          <div class="trainer-image">
            <img src="${trainer.image}">
            <button class="animon-btn">${lang === "pt" ? "Ver Animons" : "View Animons"}</button>
          </div>
          <div class="trainer-info">
            <div class="description">${trainer.description[lang]}</div>
            <div class="drops">${trainer.drops[lang]}</div>
          </div>
        </div>
      `;

      card.querySelector(".animon-btn").onclick = () => {
        modalAnimons.innerHTML = trainer.animons.map(a => `• ${a}`).join("<br>");
        modal.classList.add("active");
      };

      trainerList.appendChild(card);
    });
}

function closeModal(){
  modal.classList.remove("active");
}

/* SEARCH */
searchInput.addEventListener("input", () => {
  renderTrainers(searchInput.value.toLowerCase());
});

/* LANGUAGE */
const texts = {
  pt: {
    btn: "🇧🇷 PT",
    search: "Pesquisar treinador...",
    title: "Treinadores Retornáveis"
  },
  en: {
    btn: "🇺🇸 EN",
    search: "Search trainer...",
    title: "Returnable Trainers"
  }
};

let lang = localStorage.getItem("siteLang") || "pt";

function updateLang(){
  langBtn.textContent = texts[lang].btn;
  searchInput.placeholder = texts[lang].search;
  document.getElementById("pageTitle").textContent = texts[lang].title;
  renderTrainers(searchInput.value.toLowerCase());
}

langBtn.onclick = () => {
  lang = lang === "pt" ? "en" : "pt";
  localStorage.setItem("siteLang", lang);
  updateLang();

  if (typeof updateMenuLang === "function") {
    updateMenuLang();
  }
};

updateLang();
</script>

</body>
</html>
