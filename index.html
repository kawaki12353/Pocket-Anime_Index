<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pocket Anime - Index</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kawaki12353.github.io/Pocket-Anime_Index/index.html">
    <meta property="og:title" content="Pocket Anime Index">
    <meta property="og:description" content="The ultimate unofficial database for Pocket Anime! Explore the complete Anidex, weakness calculator, detailed maps, and everything you need to master your journey.">
    <meta property="og:image" content="https://kawaki12353.github.io/Pocket-Anime_Index/assets/embed_index.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="menu.css">
    <script src="menu.js" defer></script>

    <style>
        /* --- Variáveis e Temas (IGUAIS AO MOVES.HTML) --- */
        :root {
            --bg: #f2f4f7;
            --card: #ffffff;
            --text: #111;
            --text-secondary: #707a8a;
            --border: #ccc;
            --hover: #f1f1f1;
            --accent-blue: #007bff;

            --action-width: 260px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1217;
                --card: #181c24;
                --text: #ffffff;
                --text-secondary: #9ca3af;
                --border: #2a2f3a;
                --hover: #232836;
            }
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease;
            padding: 40px 0; /* Aumentado para acomodar FAQ */
        }

        /* CONTAINER PRINCIPAL */
        .container, .credits-container, .faq-container {
            background: var(--card);
            color: var(--text);
            border-radius: 16px;
            padding: 30px 25px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
            transition: background 0.3s ease;
        }

        .credits-container, .faq-container {
            margin-top: 20px;
            padding: 20px 25px;
        }

        /* FAQ STYLE (Igual maps.html) */
        .faq-container { text-align: left; }
        .faq-title { text-align: center; margin-bottom: 15px; font-size: 20px; }

        .faq-item {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .faq-header {
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            background: var(--card);
            transition: background 0.2s;
        }

        .faq-header:hover { background: var(--hover); }

        .faq-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            background: var(--bg);
        }

        .faq-content p {
            padding: 12px;
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .faq-item.active .faq-content { max-height: 300px; }

        /* ELEMENTOS INTERNOS */
        .logo {
            width: 240px;
            max-width: 75%;
            margin-bottom: 10px;
        }

        h1 { margin: 20px 0 10px; }
        p { font-size: 15px; line-height: 1.6; }
        #subDescription { margin-top: 6px; font-size: 14px; opacity: 0.85; }

        .credits-container h2 { margin: 0 0 12px; font-size: 20px; }
        .credits-container p { margin: 6px 0; font-size: 14px; }

        /* BOTÃO DISCORD */
        .discord-btn {
            margin: 25px auto 0;
            display: block;
            width: var(--action-width);
            max-width: 90%;
            text-decoration: none;
        }

        .discord-img {
            width: 100%;
            border-radius: 12px;
            transition: transform 0.25s ease;
        }

        .discord-btn:hover .discord-img {
            transform: scale(1.04);
        }

        /* IDIOMA (ESTILO IGUAL AO MOVES.HTML) */
        .lang-toggle {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .lang-toggle button {
            background: var(--text);
            color: var(--card);
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        /* MOBILE */
        @media (max-width: 480px) {
            body { padding: 20px 0; justify-content: flex-start; }
            .container, .credits-container, .faq-container { width: 85%; padding: 24px 20px; }
            h1 { font-size: 22px; }
            .logo { width: 200px; }
        }
    </style>
</head>

<body>

    <main class="container">
        <img src="assets/Pocket-Anime-logo.png" class="logo" alt="Pocket Anime Logo">

        <p id="description"></p>
        <p id="subDescription"></p>

        <a href="https://discord.gg/pocketanime" target="_blank" class="discord-btn">
            <img 
                src="assets/discordofficial_botton.png" 
                data-hover="assets/discordofficial_botton_on.png" 
                class="discord-img" 
                alt="Official Discord">
        </a>
    </main>

    <section class="faq-container">
        <h2 class="faq-title">FAQ</h2>
        <div id="faqList"></div>
    </section>

    <footer class="credits-container">
        <h2 id="creditsTitle"></h2>
        <p><strong id="creditsCreatorLabel"></strong><br><span id="creditsCreatorText"></span></p>
        <p><strong id="creditsHelpersLabel"></strong><br><span id="creditsHelpersText"></span></p>
        <p><strong id="creditsToolsLabel"></strong><br><span id="creditsToolsText"></span></p>
    </footer>

    <div class="lang-toggle">
        <button id="langBtn"></button>
    </div>

    <script>
        const preloadDiscord = new Image();
        preloadDiscord.src = "assets/discordofficial_botton_on.png";

        const texts = {
            pt: {
                description: "Site criado com o objetivo de ajudar a todos que gostam de Pocket Anime. Clique nas 3 barrinhas do canto esquerdo superior para selecionar uma das funcionalidades do Site.",
                subDescription: "Abaixo está o Discord Oficial do Pocket Anime.",
                langBtn: "🇧🇷 PT",
                creditsTitle: "Créditos",
                creditsCreatorLabel: "Criador:",
                creditsCreatorText: "Kawakizin – Discord (Kawaki1963)",
                creditsHelpersLabel: "Ajudantes:",
                creditsHelpersText: "Kyodaina - Discord (kyodaina0)",
                creditsToolsLabel: "Ferramentas de auxílio:",
                creditsToolsText: "IA • ibisPaint • Canva",
                faq: [
                    { h: "📘 - O que é este Site?", c: "Este Site não-oficial foi criado para ajudar os jogadores de Pocket Anime, reunindo informações sobre a Anidex, Itens, e muitas outras coisas para Ajudar a Comunidade." },
                    { h: "📖 - O que encontro na Anidex?", c: "Na Anidex você encontrará: Nome do Animon (em que você pode pesquisar pelo Nome original, nome do anime ou pelo ID), Elementos e o Status, e dentro de cada página de Animon pode ver os Moves e outras coisas." },
                    { h: "📍 - Onde vejo os spawns dos Animons?", c: "Os spawns estão indicados em cada Animon, na parte de Localizações, onde lá mostra se ele é apenas obtivel via Evento, ou se poder ter ou não um Evento que aumente a Chance de ele surgir." },
                    { h: "🎯 - Todos os Animons podem ser capturados?", c: "Não, alguns personagens só podem ser obtidos via eventos, desbloqueados por evolução, NPCs ou Requisitos/Summon." },
                    { h: "🔄 - O guia será atualizado?", c: "Sim, o guia é atualizado sempre que o Pocket Anime receber uma atualização ou alteração. A data da última alteração estará visível na Update Log nas 3 Barrinhas." },
                    { h: "❓ - O que significa não achar um Animon?", c: "Isso pode significar que: Ou o personagem ainda não foi adicionado ao jogo, ou a Anidex do Site ainda será atualizado em breve caso o jogo tenha atualizado. Mais provável que não esteja no jogo ainda." },
                    { h: "🛠️ - Como posso ajudar?", c: "Você pode nos ajudar encontrando erros, sugerindo algo ou com informações que estejam faltando/incorretas, entrando no discord oficial do Pocket Anime e me informar por ele." }
                ]
            },
            en: {
                description: "Site created to help everyone who enjoys Pocket Anime. Click on the three bars in the upper left corner to select one of the Site's features.",
                subDescription: "Below is the official Pocket Anime Discord server.",
                langBtn: "🇺🇸 EN",
                creditsTitle: "Credits",
                creditsCreatorLabel: "Creator:",
                creditsCreatorText: "Kawakizin – Discord (Kawaki1963)",
                creditsHelpersLabel: "Helpers:",
                creditsHelpersText: "Kyodaina - Discord (kyodaina0)",
                creditsToolsLabel: "Support tools:",
                creditsToolsText: "AI • ibisPaint • Canva",
                faq: [
                    { h: "📘 - What is this Site?", c: "This unofficial site was created to help Pocket Anime players, gathering information about Anidex, Items, and many other things to help the community." },
                    { h: "📖 - What do I find in Anidex?", c: "In Anidex you will find: Animon Name (searchable by original name, anime name, or ID), Elements, and Stats. Inside each Animon page, you can see Moves and more." },
                    { h: "📍 - Where can I see Animon spawns?", c: "Spawns are indicated on each Animon page under 'Locations', showing if it's event-only or if there's an active event increasing its spawn rate." },
                    { h: "🎯 - Can all Animons be captured?", c: "No, some characters can only be obtained via events, evolution unlocks, NPCs, or specific Requirements/Summoning." },
                    { h: "🔄 - Will the guide be updated?", c: "Yes, the guide is updated whenever Pocket Anime receives an update or change. The date of the last change is visible in the Update Log in the menu." },
                    { h: "❓ - What if I can't find an Animon?", c: "This could mean: Either the character hasn't been added to the game yet, or the site's Anidex is pending an update. Most likely, it's not in the game yet." },
                    { h: "🛠️ - How can I help?", c: "You can help us by finding errors, suggesting improvements, or reporting missing/incorrect info via the official Pocket Anime Discord." }
                ]
            }
        };

        let lang = localStorage.getItem("siteLang") || "pt";

        // Cria a estrutura do FAQ apenas uma vez
        function renderFAQ() {
            const faqList = document.getElementById("faqList");
            faqList.innerHTML = "";
            texts[lang].faq.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "faq-item";
                div.innerHTML = `
                    <div class="faq-header">${item.h}</div>
                    <div class="faq-content"><p>${item.c}</p></div>
                `;
                div.querySelector(".faq-header").onclick = () => {
                    const isActive = div.classList.contains("active");
                    document.querySelectorAll(".faq-item").forEach(i => i.classList.remove("active"));
                    if (!isActive) div.classList.add("active");
                };
                faqList.appendChild(div);
            });
        }

        // Atualiza apenas os textos, sem reconstruir o DOM (evita fechar o que está aberto)
        function updateLang() {
            const t = texts[lang];
            document.getElementById("description").textContent = t.description;
            document.getElementById("subDescription").textContent = t.subDescription;
            document.getElementById("langBtn").textContent = t.langBtn;
            document.getElementById("creditsTitle").textContent = t.creditsTitle;
            document.getElementById("creditsCreatorLabel").textContent = t.creditsCreatorLabel;
            document.getElementById("creditsCreatorText").textContent = t.creditsCreatorText;
            document.getElementById("creditsHelpersLabel").textContent = t.creditsHelpersLabel;
            document.getElementById("creditsHelpersText").textContent = t.creditsHelpersText;
            document.getElementById("creditsToolsLabel").textContent = t.creditsToolsLabel;
            document.getElementById("creditsToolsText").textContent = t.creditsToolsText;
            
            const faqItems = document.querySelectorAll(".faq-item");
            if (faqItems.length === 0) {
                renderFAQ();
            } else {
                t.faq.forEach((item, index) => {
                    if (faqItems[index]) {
                        faqItems[index].querySelector(".faq-header").textContent = item.h;
                        faqItems[index].querySelector(".faq-content p").textContent = item.c;
                    }
                });
            }
        }

        document.getElementById("langBtn").onclick = () => {
            lang = lang === "pt" ? "en" : "pt";
            localStorage.setItem("siteLang", lang);
            updateLang();
            if (typeof updateMenuLang === "function") updateMenuLang();
        };

        // Lógica de Hover do Botão Discord
        const discordImg = document.querySelector(".discord-img");
        const originalSrc = discordImg.src;
        const hoverSrc = discordImg.dataset.hover;

        const setDiscordImg = (src) => { discordImg.src = src; };

        discordImg.addEventListener("mouseenter", () => setDiscordImg(hoverSrc));
        discordImg.addEventListener("mouseleave", () => setDiscordImg(originalSrc));
        discordImg.addEventListener("touchstart", () => setDiscordImg(hoverSrc));
        discordImg.addEventListener("touchend", () => setDiscordImg(originalSrc));

        // Inicialização
        updateLang();
    </script>

</body>
</html>
