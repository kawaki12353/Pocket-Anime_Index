<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Anime - Team Builder</title>

  <link rel="stylesheet" href="menu.css">
  <script src="menu.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #f2f4f7; --card: #ffffff; --text: #111; --border: #ccc;
      --hover: #f1f1f1; --lang-btn: #ffffff; --lang-btn-bg: #444; --right-column: 58px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1217; --card: #181c24; --text: #ffffff; --border: #2a2f3a;
        --hover: #232836; --lang-btn: #111; --lang-btn-bg: #ffffff;
      }
    }

    /* Cores Elementos */
    .element-neutral { --element-color: #e6e5e3; } .element-fire { --element-color: #e60000; }
    .element-water { --element-color: #00b0e6; } .element-nature { --element-color: #24e30c; }
    .element-light { --element-color: #decc7c; } .element-dark { --element-color: #262626; }
    /* Adicione as outras conforme necessário... */

    body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .header { display: flex; flex-direction: column; align-items: center; max-width: 1200px; margin: 0 auto 30px; gap: 12px; }
    .logo { width: 260px; }
    .team-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }

    /* Slots */
    .team-slot { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px; min-height: 130px; padding: 14px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .team-slot::after { content: ""; position: absolute; top: 0; bottom: 0; right: var(--right-column); width: 1px; background: var(--border); }
    .slot-info { position: absolute; top: 10px; left: 14px; text-align: left; }
    .slot-name { font-weight: bold; font-size: 18px; }
    .slot-level { font-size: 14px; opacity: 0.8; }
    .slot-center img { width: 95px; height: 95px; object-fit: contain; cursor: pointer; }
    
    /* Botões Laterais */
    .slot-edit, .slot-delete { position: absolute; right: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.6; }
    .slot-edit { top: 14px; }
    .slot-delete { top: 50%; transform: translateY(-50%); } /* Lixeira no meio vertical da coluna direita */
    .slot-edit:hover, .slot-delete:hover { opacity: 1; scale: 1.1; }
    .slot-edit img, .slot-delete img { width: 22px; height: 22px; }

    /* Elementos */
    .slot-elements { position: absolute; top: 10px; right: calc(var(--right-column) + 12px); display: flex; flex-direction: column; gap: 4px; }
    .element-wrapper { width: 38px; height: 38px; background: #191919; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; }
    .element-inner { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--element-color); position: relative; }
    .element-inner img { width: 32px; height: 32px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: var(--card); width: 550px; max-height: 90vh; border-radius: 20px; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
    .edit-body { overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* Custom Select Moves */
    .moves-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .custom-select { position: relative; width: 100%; }
    .select-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; }
    .select-options { position: absolute; top: 100%; left: 0; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; max-height: 250px; overflow-y: auto; display: none; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .select-options.open { display: block; }
    
    .option { padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .option:hover { background: var(--hover); }
    
    .move-name-txt { flex: 1; font-size: 15px; }
    .move-icon-element { width: 22px; height: 22px; object-fit: contain; }
    .move-icon-category { width: 24px; height: 24px; object-fit: contain; margin-left: auto; }

    .analysis { margin-top: 25px; background: var(--card); padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-btn { background: var(--bg); padding: 8px; border-radius: 10px; text-align: center; }
    .stat-label { font-size: 10px; opacity: 0.6; }
    
    .fab-add { position: fixed; right: 20px; bottom: 80px; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 30px; background: var(--lang-btn-bg); color: var(--lang-btn); cursor: pointer; z-index: 999; }

    @media (max-width: 600px) { .modal { width: 95%; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-top"><img src="assets/Pocket-Anime-logo.png" class="logo"></div>
    <h2 id="mapTitle"></h2>
  </header>

  <main class="map-list">
    <div id="teamExportArea">
      <div class="team-grid" id="teamGrid"></div>
      <div class="analysis">
        <div>
          <button id="shareBtn"></button>
          <button id="exportBtn">Exportar Imagem</button>
        </div>
        <div>
          <h3 id="statsTitle"></h3>
          <div id="statsTotal" class="stats-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modal"><div class="modal"><h3 id="modalTitle"></h3><div class="modal-search"><input type="text" id="searchInput"></div><div class="modal-list" id="animonList"></div></div></div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="editModalTitle">Editar Animon</h3>
      <div class="edit-body">
        <div class="level-container">
          Level: <span id="levelValueDisplay">100</span>
          <input type="range" id="levelInput" min="1" max="100" value="100">
        </div>
        <div class="moves-grid">
          <div class="custom-select" id="moveSelect0" data-slot="0"></div>
          <div class="custom-select" id="moveSelect1" data-slot="1"></div>
          <div class="custom-select" id="moveSelect2" data-slot="2"></div>
          <div class="custom-select" id="moveSelect3" data-slot="3"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="fab-add" id="addAnimonBtn">+</button>

  <script src="team-infos/typechart.js"></script>
  <script src="team-infos/moves.js"></script>
  <script src="team-infos/animons.js"></script>

  <script>
    const texts = {
      pt: { title: "Team Builder", empty: "Slot Vazio", modalTitle: "Escolha um Animon", moveEmpty: "Nenhum Ataque", search: "Pesquisar..." },
      en: { title: "Team Builder", empty: "Empty Slot", modalTitle: "Choose an Animon", moveEmpty: "No Move", search: "Search..." }
    };

    let lang = localStorage.getItem("siteLang") || "pt";
    let team = JSON.parse(localStorage.getItem("team")) || [];
    let editSlotIndex = null;

    const DOM = {
      grid: document.getElementById("teamGrid"),
      editModal: document.getElementById("editModal"),
      levelInput: document.getElementById("levelInput"),
      levelValueDisplay: document.getElementById("levelValueDisplay")
    };

    function init() {
      renderTeam();
      
      // Auto-save no Level
      DOM.levelInput.addEventListener('input', (e) => {
        const val = e.target.value;
        DOM.levelValueDisplay.textContent = val;
        if(editSlotIndex !== null) {
          team[editSlotIndex].level = parseInt(val);
          saveAndRefresh();
        }
      });
    }

    function saveAndRefresh() {
      localStorage.setItem("team", JSON.stringify(team));
      renderTeam();
    }

    /* --- Lógica de Ataques (Moves) --- */
    function getMoveHtml(moveName) {
      if (!moveName) return `<span class="move-name-txt">${texts[lang].moveEmpty}</span>`;
      const m = moves.find(x => x.name === moveName);
      if (!m) return `<span class="move-name-txt">${moveName}</span>`;

      return `
        <span class="move-name-txt">${m.name}</span>
        <img src="assets/${m.type.toLowerCase()}_element.png" class="move-icon-element">
        <img src="assets/${m.attack.toLowerCase()}.png" class="move-icon-category">
      `;
    }

    function createMoveSelect(containerId, currentMove, availableMoves) {
      const container = document.getElementById(containerId);
      const btn = container.querySelector('.select-btn') || document.createElement('div');
      const menu = container.querySelector('.select-options') || document.createElement('div');
      
      btn.className = 'select-btn';
      btn.innerHTML = getMoveHtml(currentMove);
      menu.className = 'select-options';

      // Criar lista de opções
      let optionsHtml = `<div class="option" data-value="">${texts[lang].moveEmpty}</div>`;
      availableMoves.forEach(mName => {
        optionsHtml += `<div class="option" data-value="${mName}">${getMoveHtml(mName)}</div>`;
      });
      menu.innerHTML = optionsHtml;

      if(!container.contains(btn)) {
        container.appendChild(btn);
        container.appendChild(menu);
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.select-options').forEach(el => el !== menu && el.classList.remove('open'));
        menu.classList.toggle('open');
      };

      menu.querySelectorAll('.option').forEach(opt => {
        opt.onclick = () => {
          const moveValue = opt.dataset.value;
          const slotIdx = parseInt(container.dataset.slot);
          
          team[editSlotIndex].moves[slotIdx] = moveValue;
          btn.innerHTML = getMoveHtml(moveValue);
          menu.classList.remove('open');
          saveAndRefresh();
        };
      });
    }

    function openEditModal(index) {
      editSlotIndex = index;
      const animon = team[index];
      
      DOM.levelInput.value = animon.level || 100;
      DOM.levelValueDisplay.textContent = DOM.levelInput.value;

      const movesList = animon.movesList || [];
      const currentMoves = animon.moves || ["", "", "", ""];

      for (let i = 0; i < 4; i++) {
        createMoveSelect(`moveSelect${i}`, currentMoves[i], movesList);
      }

      DOM.editModal.style.display = "flex";
    }

    function renderTeam() {
      DOM.grid.innerHTML = "";
      for (let i = 0; i < 6; i++) {
        const div = document.createElement("div");
        div.className = "team-slot";
        if (team[i]) {
          div.innerHTML = `
            <div class="slot-info">
              <div class="slot-name">${team[i].name}</div>
              <div class="slot-level">Lv.${team[i].level || 100}</div>
            </div>
            <div class="slot-elements">${team[i].type.map(t => `<div class="element-wrapper element-${t.toLowerCase()}"><div class="element-inner"><img src="assets/${t.toLowerCase()}_element.png"></div></div>`).join("")}</div>
            <div class="slot-center"><img src="${team[i].sprite}"></div>
            <div class="slot-edit" onclick="event.stopPropagation(); openEditModal(${i})"><img src="assets/pencil.png"></div>
            <div class="slot-delete" onclick="event.stopPropagation(); removeFromTeam(${i})"><img src="assets/bin.png"></div>
          `;
        } else {
          div.innerHTML = `<div class="empty-slot">${texts[lang].empty}</div>`;
        }
        DOM.grid.appendChild(div);
      }
    }

    function removeFromTeam(index) {
      team.splice(index, 1);
      saveAndRefresh();
    }

    // Fechar modais ao clicar fora
    window.onclick = (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.style.display = "none";
        document.querySelectorAll('.select-options').forEach(el => el.classList.remove('open'));
      }
    };

    document.getElementById("addAnimonBtn").onclick = () => {
      // Lógica de abrir modal de escolha (simplificada para este exemplo)
      document.getElementById("modal").style.display = "flex";
    };

    init();
  </script>
</body>
</html>
