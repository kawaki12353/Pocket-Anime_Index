<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pocket Anime - Team Builder</title>

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

:root{
  --bg:#f2f4f7;
  --card:#ffffff;
  --text:#111;
  --border:#ccc;
  --hover:#f1f1f1;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1217;
    --card:#181c24;
    --text:#fff;
    --border:#2a2f3a;
    --hover:#232836;
  }
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  width:220px;
}

.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:20px;
}

select, button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

button:hover{
  background:var(--hover);
}

.team-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
  margin-bottom:30px;
}

.team-slot{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  text-align:center;
  min-height:180px;
}

.team-slot img{
  width:90px;
}

.analysis{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  max-width:700px;
  margin:0 auto 30px;
}

.export-area{
  padding:30px;
  border-radius:20px;
}

.rating{
  font-weight:bold;
  font-size:18px;
}
</style>
</head>

<body>

<div class="header">
  <img src="assets/Pocket-Anime-logo.png" class="logo">
  <h2>Team Builder</h2>
</div>

<div class="controls">
  <select id="animonSelect"></select>
  <button id="addBtn">Adicionar</button>
  <button id="shareBtn">Copiar Link</button>
  <button id="exportBtn">Exportar Imagem</button>
</div>

<div id="teamExportArea" class="export-area">
  <div class="team-grid" id="teamGrid"></div>

  <div class="analysis">
    <h3>Total do Time</h3>
    <div id="statsTotal"></div>
    <p id="weakness"></p>
    <p id="rating" class="rating"></p>
  </div>
</div>

<script>
/* ======================
   🔥 DADOS
====================== */

const animons = [
{
  id:1,
  name:"Ruffy",
  type:"Fire",
  sprite:"https://via.placeholder.com/90",
  stats:{hp:80,atk:95,def:60,spd:85}
},
{
  id:2,
  name:"Mystic Bojin",
  type:"Water",
  sprite:"https://via.placeholder.com/90",
  stats:{hp:100,atk:70,def:90,spd:50}
},
{
  id:3,
  name:"TS Ruffy",
  type:"Fire",
  sprite:"https://via.placeholder.com/90",
  stats:{hp:95,atk:110,def:70,spd:100}
}
];

const typeChart={
  Fire:{weak:["Water"]},
  Water:{weak:["Grass"]},
  Grass:{weak:["Fire"]}
};

let team = JSON.parse(localStorage.getItem("team")) || [];

/* ======================
   LOAD SELECT
====================== */

const select = document.getElementById("animonSelect");

animons.forEach(a=>{
  const opt=document.createElement("option");
  opt.value=a.id;
  opt.textContent=a.name;
  select.appendChild(opt);
});

/* ======================
   ADD
====================== */

document.getElementById("addBtn").onclick=()=>{
  if(team.length>=6) return;

  const id=Number(select.value);
  const animon=animons.find(a=>a.id===id);
  team.push(animon);

  save();
  render();
};

/* ======================
   REMOVE
====================== */

function removeMember(index){
  team.splice(index,1);
  save();
  render();
}

/* ======================
   SAVE
====================== */

function save(){
  localStorage.setItem("team",JSON.stringify(team));
}

/* ======================
   ANALYSIS
====================== */

function calcTotals(){
  let total={hp:0,atk:0,def:0,spd:0};

  team.forEach(a=>{
    total.hp+=a.stats.hp;
    total.atk+=a.stats.atk;
    total.def+=a.stats.def;
    total.spd+=a.stats.spd;
  });

  return total;
}

function calcWeak(){
  let weakCount={};

  team.forEach(a=>{
    typeChart[a.type]?.weak.forEach(w=>{
      weakCount[w]=(weakCount[w]||0)+1;
    });
  });

  let worst=Object.entries(weakCount)
  .sort((a,b)=>b[1]-a[1])[0];

  return worst?worst[0]:"Nenhuma";
}

function calcRating(t){
  if(t.atk>t.def && t.atk>t.hp) return "Ofensivo 🔥";
  if(t.def>t.atk) return "Defensivo 🛡️";
  return "Balanceado ⚖️";
}

/* ======================
   RENDER
====================== */

function render(){
  const grid=document.getElementById("teamGrid");
  grid.innerHTML="";

  for(let i=0;i<6;i++){
    const div=document.createElement("div");
    div.className="team-slot";

    if(team[i]){
      div.innerHTML=`
        <img src="${team[i].sprite}">
        <h4>${team[i].name}</h4>
        <small>${team[i].type}</small><br>
        <button onclick="removeMember(${i})">Remover</button>
      `;
    }else{
      div.innerHTML="<p>Slot vazio</p>";
    }

    grid.appendChild(div);
  }

  const total=calcTotals();

  document.getElementById("statsTotal").innerHTML=`
    HP: ${total.hp} |
    ATK: ${total.atk} |
    DEF: ${total.def} |
    SPD: ${total.spd}
  `;

  document.getElementById("weakness").textContent=
    "Fraqueza Global: "+calcWeak();

  document.getElementById("rating").textContent=
    "Classificação: "+calcRating(total);
}

/* ======================
   SHARE
====================== */

document.getElementById("shareBtn").onclick=()=>{
  const ids=team.map(a=>a.id).join(",");
  const url=location.origin+location.pathname+"?team="+ids;
  navigator.clipboard.writeText(url);
  alert("Link copiado!");
};

/* ======================
   LOAD FROM URL
====================== */

const params=new URLSearchParams(location.search);
if(params.get("team")){
  const ids=params.get("team").split(",").map(Number);
  team=ids.map(id=>animons.find(a=>a.id===id)).filter(Boolean);
}

/* ======================
   EXPORT IMAGE
====================== */

document.getElementById("exportBtn").onclick=async()=>{
  const area=document.getElementById("teamExportArea");

  const canvas=await html2canvas(area,{
    backgroundColor:null,
    scale:2
  });

  const link=document.createElement("a");
  link.download="pocket-anime-team.png";
  link.href=canvas.toDataURL();
  link.click();
};

/* ======================
   INIT
====================== */

render();
</script>

</body>
</html>
