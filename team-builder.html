<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<title>Pocket Anime - Team Builder</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  margin: 0;
}

:root{
  --bg: #f2f4f7;
  --card: #ffffff;
  --text: #111;
  --border: #ccc;
  --hover: #f1f1f1;
  --lang-btn: #ffffff;
  --lang-btn-bg: #444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1217;
    --card: #181c24;
    --text: #ffffff;
    --border: #2a2f3a;
    --hover: #232836;
    --lang-btn: #111;
    --lang-btn-bg: #ffffff;
  }
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto 30px;
  gap: 12px;
}

.header-top {
  width: 100%;
  display: flex;
  justify-content: center;
}

.logo { width: 260px; }

.map-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.search-container {
  display:none; /* removido botão adicionar */
}

.map-list { max-width:1200px; margin:0 auto; }

.team-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}

.team-slot{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  aspect-ratio:1/1; /* 🔥 QUADRADO */
  padding:10px;
}

.team-slot img{ width:80px; }

.analysis{
  margin-top:25px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
}

.analysis button{
  margin-top:10px;
  padding:8px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:var(--lang-btn-bg);
  color:var(--lang-btn);
}

.lang-toggle {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.lang-toggle button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: var(--lang-btn-bg);
  color: var(--lang-btn);
}

@media (max-width: 768px) {
  .header-top {
    display: flex;
    justify-content: flex-end;
    width: 100%;
  }
  .logo { width: 150px; }
}
</style>
</head>

<body>

<div class="header">
 <div class="header-top">
  <img src="assets/Pocket-Anime-logo.png" class="logo">
 </div>

 <h2 class="map-title" id="mapTitle"></h2>
</div>

<div class="map-list">
  <div id="teamExportArea">
    <div class="team-grid" id="teamGrid"></div>

    <div class="analysis">
      <div id="statsTotal"></div>
      <div id="weakness"></div>
      <div id="rating"></div>
      <button id="shareBtn"></button>
      <button id="exportBtn">Exportar Imagem</button>
    </div>
  </div>
</div>

<div class="lang-toggle">
  <button id="langBtn"></button>
</div>

<script>
const animons = [
 {id:1,name:"Ruffy",type:"Fire",sprite:"assets/animons/ruffy.png",stats:{hp:80,atk:95,def:60,spd:85}},
 {id:2,name:"Mystic Bojin",type:"Water",sprite:"assets/animons/mystic_bojin.png",stats:{hp:100,atk:70,def:90,spd:50}},
 {id:3,name:"TS Ruffy",type:"Fire",sprite:"assets/animons/ts_ruffy.png",stats:{hp:95,atk:110,def:70,spd:100}}
];

const typeChart={
 Fire:{weak:["Water"]},
 Water:{weak:["Grass"]},
 Grass:{weak:["Fire"]}
};

const texts={
 pt:{btn:"🇧🇷 PT",title:"Team Builder",share:"Copiar Link",weak:"Fraqueza Global:",rating:"Classificação:",empty:"Clique para adicionar"},
 en:{btn:"🇺🇸 EN",title:"Team Builder",share:"Copy Link",weak:"Global Weakness:",rating:"Rating:",empty:"Click to add"}
};

let lang=localStorage.getItem("siteLang")||"pt";
let team=JSON.parse(localStorage.getItem("team"))||[];

const grid=document.getElementById("teamGrid");
const shareBtn=document.getElementById("shareBtn");
const exportBtn=document.getElementById("exportBtn");
const langBtn=document.getElementById("langBtn");

function save(){ localStorage.setItem("team",JSON.stringify(team)); }

function render(){
 grid.innerHTML="";
 for(let i=0;i<6;i++){
  const div=document.createElement("div");
  div.className="team-slot";

  if(team[i]){
   div.innerHTML=`
    <img src="${team[i].sprite}">
    <h4>${team[i].name}</h4>
    <small>${team[i].type}</small><br>
    <button onclick="event.stopPropagation();removeFromTeam(${i})">X</button>
   `;
  }else{
   div.innerHTML=`<p>${texts[lang].empty}</p>`;
   div.onclick=()=>addToSlot(i); /* 🔥 CLICA NO SLOT */
  }

  grid.appendChild(div);
 }

 updateAnalysis();
}

function addToSlot(index){
 if(team.length>=6) return;

 let list=animons.map(a=>`${a.id} - ${a.name}`).join("\n");
 let choice=prompt("Escolha o ID do Animon:\n\n"+list);

 const selected=animons.find(a=>a.id==choice);
 if(selected){
  team[index]=selected;
  save();
  render();
 }
}

function removeFromTeam(i){
 team.splice(i,1);
 save();
 render();
}

function updateAnalysis(){
 const total={hp:0,atk:0,def:0,spd:0};
 team.forEach(a=>{
  total.hp+=a.stats.hp;
  total.atk+=a.stats.atk;
  total.def+=a.stats.def;
  total.spd+=a.stats.spd;
 });

 document.getElementById("statsTotal").innerHTML=
 `HP:${total.hp} | ATK:${total.atk} | DEF:${total.def} | SPD:${total.spd}`;

 let weaknesses={};
 team.forEach(a=>{
  typeChart[a.type]?.weak.forEach(w=>{
   weaknesses[w]=(weaknesses[w]||0)+1;
  });
 });

 const worst=Object.entries(weaknesses).sort((a,b)=>b[1]-a[1])[0];
 document.getElementById("weakness").textContent=
 texts[lang].weak+" "+(worst?worst[0]:"None");

 let rating="Balanceado ⚖️";
 if(total.atk>total.def) rating="Ofensivo 🔥";
 if(total.def>total.atk) rating="Defensivo 🛡️";

 document.getElementById("rating").textContent=
 texts[lang].rating+" "+rating;
}

shareBtn.onclick=()=>{
 const ids=team.map(a=>a.id).join(",");
 const url=location.origin+location.pathname+"?team="+ids;
 navigator.clipboard.writeText(url);
 alert("Link copiado!");
};

exportBtn.onclick=async()=>{
 const canvas=await html2canvas(document.getElementById("teamExportArea"),{scale:2});
 const link=document.createElement("a");
 link.download="pocket-anime-team.png";
 link.href=canvas.toDataURL();
 link.click();
};

langBtn.onclick=()=>{
 lang=lang==="pt"?"en":"pt";
 localStorage.setItem("siteLang",lang);
 updateLang();
 render();
 if(typeof updateMenuLang==="function") updateMenuLang();
};

function updateLang(){
 document.getElementById("mapTitle").textContent=texts[lang].title;
 shareBtn.textContent=texts[lang].share;
 langBtn.textContent=texts[lang].btn;
}

updateLang();
render();
</script>

</body>
</html>
