<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Anime - Animon Details</title>

    <link rel="stylesheet" href="menu.css">
    <script src="menu.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- Variáveis e Temas --- */
        :root {
            --bg: #f2f4f7;
            --card: #ffffff;
            --text: #111;
            --border: #ccc;
            --hover: #f1f1f1;
            --lang-btn: #ffffff;
            --lang-btn-bg: #444;
            --primary: #0d47a1;
            --chart-fill: rgba(13, 71, 161, 0.4);
            --chart-line: rgba(13, 71, 161, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1217;
                --card: #181c24;
                --text: #ffffff;
                --border: #2a2f3a;
                --hover: #232836;
                --lang-btn: #111;
                --lang-btn-bg: #ffffff;
                --primary: #64b5f6;
                --chart-fill: rgba(100, 181, 246, 0.4);
                --chart-line: rgba(100, 181, 246, 1);
            }
        }

        /* --- Geral --- */
        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            margin: 0;
            line-height: 1.5;
            padding-bottom: 80px;
        }

        .header { 
            display: flex; 
            justify-content: center; 
            max-width: 1200px; 
            margin: 0 auto 30px; 
        }
        .logo { width: 220px; max-width: 60vw; }

        .top-section {
            display: flex;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto 30px;
            align-items: stretch;
        }
        .sprite-frame {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 200px;
            height: 200px;
            box-sizing: border-box;
        }
        .sprite-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .desc-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            font-size: 16px;
        }
        #nameInside {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 8px;
            color: var(--primary);
            text-transform: capitalize;
        }

        .section-label {
            max-width: 800px;
            margin: 20px auto 10px;
            font-size: 18px;
            font-weight: bold;
            color: var(--text);
            padding-left: 5px;
        }

        .traits-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            max-width: 800px;
            margin: 0 auto 30px;
            min-height: 50px;
            box-sizing: border-box;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .tab-btn {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .tab-btn:hover { background: var(--hover); }

        .tab-btn.active {
            background: var(--border);
            color: var(--text);
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            max-width: 800px;
            margin: 0 auto;
            animation: slideFadeIn 0.3s ease-out forwards;
            box-sizing: border-box;
        }
        .tab-content.active { display: block; }

        /* Ajuste: Para o balão não ser cortado, removemos overflow hidden e usamos padding estratégico */
        #tab-moves {
            height: 400px;
            overflow-y: auto;
            overflow-x: visible; /* Permite o balão "sair" pros lados se necessário */
            padding: 0;
            position: relative;
        }

        @keyframes slideFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-wrapper {
            max-width: 280px; 
            margin: 0 auto;
        }
        .stats-total {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            color: var(--primary);
        }

        .move-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 25px 25px 25px;
            /* Adicionado padding no topo para o primeiro item não ter o balão cortado pelo header sticky */
            padding-top: 10px; 
        }
        .move-item {
            position: relative;
            display: grid;
            grid-template-columns: 60px 1fr 60px 60px; 
            gap: 10px;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .move-item:hover:not(.move-header) { background: var(--border); }

        .move-header { 
            background: var(--border); 
            cursor: default;
            position: sticky;
            top: 0;
            z-index: 10;
            border-radius: 11px 11px 0 0;
            margin: 0 -25px 10px -25px;
            width: calc(100% + 50px);
            box-sizing: border-box;
        }

        .move-item span { text-align: center; }
        .move-item .move-name { text-align: left; }

        .move-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin: 0 auto;
            pointer-events: none;
        }

        /* AJUSTE BALÃO: Z-index alto e posicionamento relativo ao item */
        .move-balloon { 
            position: absolute; 
            bottom: 105%; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--card); 
            border: 2px solid var(--primary); 
            border-radius: 10px; 
            padding: 10px 14px; 
            font-size: 13px; 
            text-align: left; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
            z-index: 9999; 
            animation: fadeInBalloon 0.2s ease; 
            white-space: normal; /* Permite quebra de linha para não esticar demais */
            width: 240px;
            color: var(--text); 
            cursor: default;
            pointer-events: none;
        }
        @keyframes fadeInBalloon { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

        /* --- Grade Evolutiva --- */
        .evolution-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .evo-card {
            text-align: center;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            width: 110px;
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .evo-card:hover { transform: scale(1.05); border-color: var(--primary); }
        .evo-img { width: 70px; height: 70px; object-fit: contain; image-rendering: pixelated; }
        .evo-name { font-size: 12px; font-weight: bold; margin: 5px 0; text-transform: capitalize; display: block; }
        .evo-types { display: flex; justify-content: center; gap: 4px; }
        .evo-types img { width: 18px; height: 18px; }
        .evo-arrow { font-size: 24px; color: var(--border); font-weight: bold; }

        /* --- Fraquezas --- */
        .type-section { margin-bottom: 20px; }
        .type-section-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; opacity: 0.8; }
        .type-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .type-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            background: var(--bg);
            border: 1px solid var(--border);
            min-width: 100px;
        }
        .type-badge img { width: 20px; height: 20px; object-fit: contain; }
        .dmg-multiplier { margin-left: auto; font-size: 11px; color: var(--primary); }

        .lang-toggle {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .lang-toggle button {
            background: var(--lang-btn-bg);
            color: var(--lang-btn);
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .header { justify-content: flex-end; }
            .logo { width: 150px; }
            .top-section { flex-direction: row; align-items: center; gap: 10px; }
            .sprite-frame { width: 120px; height: 120px; }
            .desc-box { width: 100%; font-size: 14px; padding: 10px; }
            .move-item { grid-template-columns: 45px 1fr 48px 48px; font-size: 11px; padding: 8px 4px; gap: 4px; }
            .evo-arrow { transform: rotate(90deg); margin: 5px 0; }
            .evolution-row { flex-direction: column; }
        }
    </style>
</head>

<body>

<header class="header">
    <img src="assets/Pocket-Anime-logo.png" class="logo" alt="Logo">
</header>

<main>
    <div class="top-section">
        <div class="sprite-frame">
            <img id="animonSprite" src="" alt="Sprite">
        </div>
        <div class="desc-box">
            <div id="nameInside"></div> <div id="animonDesc"></div>
        </div>
    </div>

    <div class="section-label" id="labelTraits">Habilidades</div>
    <div class="traits-container" id="traitsList"></div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('tab-info')" id="btnInfo">Info</button>
        <button class="tab-btn" onclick="switchTab('tab-moves')" id="btnMoves">Moves</button>
        <button class="tab-btn" onclick="switchTab('tab-weak')" id="btnWeak">Fraquezas</button>
        <button class="tab-btn" onclick="switchTab('tab-loc')" id="btnLoc">Localização</button>
    </div>

    <div class="section-label" id="tabTitleDisplay">Status</div>

    <div id="tab-info" class="tab-content active">
        <div class="chart-wrapper">
            <canvas id="statsChart"></canvas>
        </div>
        <div class="stats-total" id="statsTotal"></div>
    </div>

    <div id="tab-moves" class="tab-content">
        <div class="move-list" id="movesContainer"></div>
    </div>

    <div id="tab-weak" class="tab-content">
        <div id="typeChartContent"></div>
    </div>

    <div id="tab-loc" class="tab-content">
        <p id="locText" style="text-align: center; font-weight: bold;"></p>
    </div>

    <div class="section-label" id="labelEvo">Grade Evolutiva</div>
    <div class="traits-container" id="evoContainer"></div>
</main>

<div class="lang-toggle">
    <button id="langBtn"></button>
</div>

<script src="database/animons.js"></script>
<script src="database/moves.js"></script>
<script src="database/typechart.js"></script>

<script>
let lang = localStorage.getItem("siteLang") || "pt";
let currentAnimon = null;
let radarChart = null;
let openedMoveBalloon = null;

const uiText = {
    pt: {
        btnInfo: "Informações", btnMoves: "Moves", btnWeak: "Fraquezas", btnLoc: "Localização",
        noDesc: "Ainda não possui descrição.", noMoves: "Ainda não possui movimentos.",
        lvl: "Nvl", name: "Nome", type: "Tipo", cat: "Categoria",
        btn: "🇧🇷 PT", totalStr: "TOTAL: ", traits: "Habilidades",
        status: "Status", attacks: "Ataques", typeChart: "Tabela de Tipo",
        evoTitle: "Grade Evolutiva", notAvail: "Ainda não disponível.",
        notDef: "Não definido."
    },
    en: {
        btnInfo: "Information", btnMoves: "Moves", btnWeak: "Weaknesses", btnLoc: "Location",
        noDesc: "No description available yet.", noMoves: "No moves available yet.",
        lvl: "Lvl", name: "Name", type: "Type", cat: "Category",
        btn: "🇺🇸 EN", totalStr: "TOTAL: ", traits: "Traits",
        status: "Status", attacks: "Attacks", typeChart: "Type Chart",
        evoTitle: "Evolution Grade", notAvail: "Not available yet.",
        notDef: "Not defined."
    }
};

function parseColoredText(text) {
  if (!text) return "";
  const colorMap = {
    "001": "#ff4d4d", "002": "#2ecc71", "003": "#f39c12", "004": "#95a5a6",
    "005": "#a93226", "006": "#d2b4de", "007": "#1a5276", "008": "#ffe100", "000": "inherit"
  };
  let formatted = text.replace(/\[(\d{3})\]/g, (match, code) => {
    if (code === "000") return "</span>";
    const color = colorMap[code];
    return color ? `</span><span style="color: ${color}; font-weight: bold;">` : match;
  });
  return `<span>${formatted}</span>`;
}

function getMoveInfo(moveInput) {
    if (!moveInput) return null;
    let finalName = typeof moveInput === 'string' ? moveInput.trim() : (moveInput.name || "Unknown");
    let moveData = null;
    if (typeof moves !== "undefined") {
        if (Array.isArray(moves)) moveData = moves.find(m => m.name && m.name.toLowerCase() === finalName.toLowerCase());
        else {
            const exactKey = Object.keys(moves).find(k => k.toLowerCase() === finalName.toLowerCase());
            if (exactKey) moveData = moves[exactKey];
        }
    }
    if (!moveData) return { name: finalName, typeStr: "neutral", attackStr: "physical", power: "-", accuracy: "-", desc: "" };
    return {
        name: moveData.name || finalName,
        typeStr: String(Array.isArray(moveData.type) ? moveData.type[0] : (moveData.type || "neutral")).toLowerCase().trim(),
        attackStr: String(moveData.attack || "physical").toLowerCase().trim(),
        power: moveData.power || "-",
        accuracy: moveData.accuracy || "-",
        desc: moveData[`desc_${lang}`] || moveData.desc_pt || moveData.desc || ""
    };
}

window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const idParam = urlParams.get('id');
    if (idParam && typeof animons !== 'undefined') {
        currentAnimon = animons.find(a => String(a.id) === String(idParam) || a.name.toLowerCase() === idParam.toLowerCase());
    }
    if (!currentAnimon) {
        document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>Animon não encontrado</h1>";
        return;
    }
    document.getElementById('animonSprite').src = currentAnimon.sprite || `assets/sprites/${currentAnimon.id}.png`;
    document.getElementById('animonSprite').onerror = function() { this.src = 'assets/sem_icone.png'; };
    updateLang();
};

function updateLang() {
    if (!currentAnimon) return;
    const ui = uiText[lang];
    document.getElementById('nameInside').textContent = currentAnimon.name;
    document.getElementById('langBtn').textContent = ui.btn;
    document.getElementById('btnInfo').textContent = ui.btnInfo;
    document.getElementById('btnMoves').textContent = ui.btnMoves;
    document.getElementById('btnWeak').textContent = ui.btnWeak;
    document.getElementById('btnLoc').textContent = ui.btnLoc;
    document.getElementById('labelTraits').textContent = ui.traits;
    document.getElementById('labelEvo').textContent = ui.evoTitle;
    document.getElementById('locText').textContent = ui.notAvail;

    let descText = (currentAnimon.desc && currentAnimon.desc[lang]) ? currentAnimon.desc[lang] : (currentAnimon[`desc_${lang}`] || ui.noDesc);
    document.getElementById('animonDesc').innerHTML = `<i>${descText.replace(/^"|"$/g, '')}</i>`;

    updateTabTitle(document.querySelector('.tab-content.active').id);
    renderStats();
    renderMoves();
    renderTypeChart();
    renderEvolutions();
}

function renderEvolutions() {
    const container = document.getElementById('evoContainer');
    container.innerHTML = "";
    
    // Lógica de Detecção por ID (ex: 84 -> 84.01 -> 84.01.01)
    const baseId = String(currentAnimon.id).split('.')[0];
    const lineage = animons.filter(a => String(a.id).startsWith(baseId)).sort((a,b) => String(a.id).length - String(b.id).length || String(a.id).localeCompare(String(a.id)));

    const row = document.createElement('div');
    row.className = 'evolution-row';

    lineage.forEach((ani, index) => {
        // Card do Animon
        const card = document.createElement('a');
        card.href = `details.html?id=${ani.id}`;
        card.className = 'evo-card';
        
        let typesHtml = "";
        const tList = Array.isArray(ani.type) ? ani.type : [ani.type];
        tList.forEach(t => {
            if(t) typesHtml += `<img src="assets/${String(t).toLowerCase()}_element.png" onerror="this.src='assets/neutral_element.png'">`;
        });

        card.innerHTML = `
            <img src="${ani.sprite || 'assets/sprites/'+ani.id+'.png'}" class="evo-img" onerror="this.src='assets/sem_icone.png'">
            <span class="evo-name">${ani.name}</span>
            <div class="evo-types">${typesHtml}</div>
        `;

        row.appendChild(card);

        // Adiciona seta se não for o último
        if (index < lineage.length - 1) {
            const arrow = document.createElement('div');
            arrow.className = 'evo-arrow';
            arrow.innerHTML = '➜';
            row.appendChild(arrow);
        }
    });

    container.appendChild(row);
}

function renderStats() {
    const st = currentAnimon.stats || { hp:0, atk:0, def:0, spAtk:0, spDef:0, spd:0 };
    const total = st.hp + st.atk + st.def + (st.spAtk || 0) + (st.spDef || 0) + st.spd;
    document.getElementById('statsTotal').textContent = uiText[lang].totalStr + total;
    const root = getComputedStyle(document.documentElement);
    const ctx = document.getElementById('statsChart').getContext('2d');
    if (radarChart) radarChart.destroy();
    radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: [`HP: ${st.hp}`, `ATK: ${st.atk}`, `DEF: ${st.def}`, `SPEED: ${st.spd}`, `SP.DEF: ${st.spDef}`, `SP.ATK: ${st.spAtk}`],
            datasets: [{
                data: [st.hp, st.atk, st.def, st.spd, st.spDef, st.spAtk],
                backgroundColor: root.getPropertyValue('--chart-fill'),
                borderColor: root.getPropertyValue('--chart-line'),
                pointBackgroundColor: root.getPropertyValue('--chart-line'),
                borderWidth: 2
            }]
        },
        options: {
            scales: { r: { angleLines: { color: root.getPropertyValue('--text'), opacity: 0.2 }, grid: { color: root.getPropertyValue('--text'), opacity: 0.2 }, pointLabels: { color: root.getPropertyValue('--text'), font: { size: 11, weight: 'bold' } }, ticks: { display: false }, suggestedMin: 0, suggestedMax: 160 } },
            plugins: { legend: { display: false }, tooltip: { enabled: false } }
        }
    });
}

function renderMoves() {
    const container = document.getElementById('movesContainer');
    const ui = uiText[lang];
    container.innerHTML = "";
    const movesList = currentAnimon.movesList || [];
    if (movesList.length === 0) { container.innerHTML = `<p style="text-align: center;">${ui.noMoves}</p>`; return; }

    const header = document.createElement('div');
    header.className = 'move-item move-header';
    header.innerHTML = `<span>${ui.lvl}</span><span class="move-name">${ui.name}</span><span>${ui.type}</span><span>${ui.cat}</span>`;
    container.appendChild(header);

    [...movesList].sort((a, b) => a.level - b.level).forEach(m => {
        const minfo = getMoveInfo(m.name);
        const row = document.createElement('div');
        row.className = 'move-item';
        row.innerHTML = `
            <span style="color: #bbb;">lvl ${m.level}</span>
            <span class="move-name">${minfo.name}</span>
            <img src="assets/${minfo.typeStr}_element.png" class="move-icon" onerror="this.src='assets/neutral_element.png'">
            <img src="assets/${minfo.attackStr}.png" class="move-icon" onerror="this.src='assets/physical.png'">
        `;
        row.onclick = (e) => { e.stopPropagation(); toggleMoveBalloon(row, minfo); };
        container.appendChild(row);
    });
}

function toggleMoveBalloon(moveDiv, minfo) {
    if (openedMoveBalloon) { openedMoveBalloon.remove(); openedMoveBalloon = null; }
    const balloon = document.createElement("div");
    balloon.className = "move-balloon";
    balloon.innerHTML = `
        <div style="margin-bottom: 8px; text-align: justify;">${parseColoredText(minfo.desc)}</div>
        <div style="text-align: center; border-top: 1px solid var(--border); padding-top: 5px; font-size: 11px;">
          <span style="color: #ee5047;"><b>Power:</b> ${minfo.power}</span> | 
          <span style="color: #fde4a1;"><b>Acc:</b> ${minfo.accuracy}</span>
        </div>
    `;
    moveDiv.appendChild(balloon);
    openedMoveBalloon = balloon;
    setTimeout(() => document.addEventListener("click", () => { if(openedMoveBalloon){openedMoveBalloon.remove(); openedMoveBalloon=null;} }, { once: true }), 0);
}

function renderTypeChart() {
    const container = document.getElementById('typeChartContent');
    container.innerHTML = "";
    if (typeof chart === 'undefined' || !currentAnimon) return;
    let defTypes = Array.isArray(currentAnimon.type || currentAnimon.types) ? (currentAnimon.type || currentAnimon.types) : [currentAnimon.type];
    defTypes = defTypes.filter(t => t).map(t => t.toLowerCase().trim());

    const groups = { x4: [], x2: [], x1: [], x05: [], x025: [], x0: [] };
    Object.keys(chart).forEach(atkType => {
        let mult = 1.0;
        defTypes.forEach(defType => {
            const match = Object.keys(chart[atkType]).find(k => k.toLowerCase() === defType);
            if (match) mult *= chart[atkType][match];
        });
        if (mult >= 3.5) groups.x4.push(atkType);
        else if (mult >= 1.5) groups.x2.push(atkType);
        else if (mult > 0.8 && mult < 1.2) groups.x1.push(atkType);
        else if (mult > 0.3) groups.x05.push(atkType);
        else if (mult > 0) groups.x025.push(atkType);
        else groups.x0.push(atkType);
    });

    const ui = uiText[lang];
    const order = [
        { key: 'x4', label: "Extrema (x4)", val: '4x' }, { key: 'x2', label: "Fraco (x2)", val: '2x' },
        { key: 'x05', label: "Resiste (x0.5)", val: '0.5x' }, { key: 'x025', label: "Super Resiste (x0.25)", val: '0.25x' },
        { key: 'x0', label: "Imune (x0)", val: '0x' }
    ];

    order.forEach(g => {
        if (groups[g.key].length > 0) {
            const div = document.createElement('div');
            div.className = 'type-section';
            div.innerHTML = `<div class="type-section-title">${g.label}</div>`;
            const grid = document.createElement('div');
            grid.className = 'type-grid';
            groups[g.key].forEach(t => {
                grid.innerHTML += `<div class="type-badge"><img src="assets/${t.toLowerCase()}_element.png" onerror="this.src='assets/neutral_element.png'"><span>${t}</span><span class="dmg-multiplier">${g.val}</span></div>`;
            });
            div.appendChild(grid);
            container.appendChild(div);
        }
    });
}

function updateTabTitle(tabId) {
    const ui = uiText[lang];
    const display = document.getElementById('tabTitleDisplay');
    const map = { 'tab-info': ui.status, 'tab-moves': ui.attacks, 'tab-weak': ui.typeChart, 'tab-loc': ui.btnLoc };
    display.textContent = map[tabId] || "";
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    const btnMap = { 'tab-info': 'btnInfo', 'tab-moves': 'btnMoves', 'tab-weak': 'btnWeak', 'tab-loc': 'btnLoc' };
    document.getElementById(btnMap[tabId]).classList.add('active');
    updateTabTitle(tabId);
}

document.getElementById('langBtn').onclick = () => {
    lang = lang === "pt" ? "en" : "pt";
    localStorage.setItem("siteLang", lang);
    updateLang();
};
</script>
